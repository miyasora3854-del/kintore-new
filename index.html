<script id="v26-photo-persistence">
(function(){
  const CACHE_PREFIX='kintoreBodyPhotos_';
  const memory={};

  function uid(){
    try{return window.fbAuth&&window.fbAuth.currentUser?window.fbAuth.currentUser.uid:''}catch(e){return ''}
  }
  function key(){return CACHE_PREFIX+(uid()||'guest')}
  function read(){
    const k=key();
    if(memory[k]) return memory[k];
    try{
      const x=JSON.parse(localStorage.getItem(k)||'[]');
      memory[k]=Array.isArray(x)?x:[];
    }catch(e){memory[k]=[]}
    return memory[k];
  }
  function write(a){
    const k=key(); memory[k]=a;
    try{localStorage.setItem(k,JSON.stringify(a));return true}catch(e){
      console.warn('body photo local cache full',e);
      return false;
    }
  }
  function setPhotos(a){
    const k=key(); memory[k]=Array.isArray(a)?a:[];
    try{localStorage.setItem(k,JSON.stringify(memory[k]));}catch(e){console.warn(e)}
    return memory[k];
  }

  window.v26BodyPhotos={
    get:function(){return read().slice()},
    set:function(a){return setPhotos(a).slice()},
    add:function(rec){
      const a=read(), i=a.findIndex(x=>x.id===rec.id);
      if(i>=0)a[i]=rec; else a.push(rec);
      a.sort((x,y)=>String(x.date||'').localeCompare(String(y.date||'')));
      setPhotos(a);
      return rec;
    },
    clear:function(){setPhotos([])}
  };

  // Backward compatibility for any older patch code.
  window.v25GetBodyPhotos=function(){return window.v26BodyPhotos.get()};
  window.v25SaveBodyPhoto=function(rec){return window.v26BodyPhotos.add(rec)};
})();
</script>

<input id="photoCameraInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoSelected(this)">
<input id="photoLibraryInput" type="file" accept="image/*" style="display:none" onchange="handlePhotoSelected(this)">
<div id="modalBg" class="modal-bg" onclick="modalBackground(event)"><div id="modal" class="modal"></div></div>

<script>
const KEY='kintoreData',MENUKEY='kintoreMenus',PLANKEY='kintorePlans',PROFILEKEY='kintoreProfile',TEMPLATEKEY='kintoreTemplates';
const FIREBASE_APP_ID='shared';
let firebaseReady=false, firebaseLoading=false, firebaseSaving=false, firebaseSaveQueued=false, firebaseUnsub=null;
const PROFILESKEY='kintoreProfiles',CURRENTUSERKEY='kintoreCurrentUser';

const categories=['胸','背中','肩','腕','脚','腹','有酸素','その他'];
const cardioExercises=['ランニング','ジョギング','ウォーキング','サイクリング','水泳','その他'];
const defaultMenus={
胸:['ベンチプレス','チェストプレス','ダンベルプレス','ディップス'],
背中:['懸垂','ラットプルダウン','ローイング','ワンハンドロー'],
肩:['ショルダープレス','サイドレイズ','フロントレイズ'],
腕:['アームカール','ハンマーカール','トライセプスプレスダウン'],
脚:['スクワット','スミスマシンスクワット','レッグプレス','レッグカール','カーフレイズ'],
腹:['アブドミナル','レッグレイズ','ケーブルクランチ'],
有酸素:cardioExercises.slice(),
その他:['その他']
};
function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}
function isoToday(){let d=new Date();return localDate(d)}
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function formatDate(s){let d=new Date(s+'T00:00:00');return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
let data=loadJSON(KEY,{});
let menus=loadJSON(MENUKEY,defaultMenus);
let plans=loadJSON(PLANKEY,{});
let templates=loadJSON(TEMPLATEKEY,{});
let profiles=loadJSON(PROFILESKEY,null);
let legacyProfile=loadJSON(PROFILEKEY,{name:'利用者',height:'',weight:''});

if(!profiles||!Object.keys(profiles).length){
  profiles={user1:{id:'user1',name:legacyProfile.name||'利用者',height:legacyProfile.height||'',weight:legacyProfile.weight||'',visibility:{workout:true,food:false,photo:false}}};
}
let currentUserId=localStorage.getItem(CURRENTUSERKEY)||Object.keys(profiles)[0];
if(!profiles[currentUserId])currentUserId=Object.keys(profiles)[0];
let aiAdviceHistory=loadJSON('kintoreAiAdviceHistory',{});
if(!aiAdviceHistory || typeof aiAdviceHistory!=='object')aiAdviceHistory={};
if(!aiAdviceHistory[currentUserId])aiAdviceHistory[currentUserId]={current:null,history:[]};
let profile=profiles[currentUserId];
if(profile&&!profile.visibility)profile.visibility={workout:true,food:false,photo:false};

function mergeDefaultMenus(){
  categories.forEach(c=>{
    if(!Array.isArray(menus[c]))menus[c]=[];
    defaultMenus[c].forEach(x=>{if(!menus[c].includes(x))menus[c].push(x)});
  });
  saveJSON(MENUKEY,menus);
}
mergeDefaultMenus();

function migrateUserData(){
  Object.keys(profiles||{}).forEach(id=>{if(profiles[id]&&!profiles[id].visibility)profiles[id].visibility={workout:true,food:false,photo:false}});
  Object.keys(data).forEach(date=>{
    let r=data[date]; if(!r||typeof r!=='object')return;
    if(!Array.isArray(r.workouts))r.workouts=[];
    r.workouts.forEach(w=>{if(!w.userId)w.userId=currentUserId});
    if(!r.memos){
      r.memos={};
      if(r.memo)r.memos[currentUserId]=r.memo;
    }
  });
  saveJSON(KEY,data);saveJSON(PROFILESKEY,profiles);localStorage.setItem(CURRENTUSERKEY,currentUserId);
}
migrateUserData();

let state={tab:'calendar',date:isoToday(),month:new Date(),modalWorkout:null,modalEditIndex:null,photoFile:null,homePreviewTab:'workout'};
let analysisState={section:'workout',unit:'month',span:12,metric:'weight',exerciseKey:'',users:[currentUserId],morphOrientation:'正面',morphPos:0,morphPlaying:false};

function saveAll(){
  saveJSON(KEY,data);saveJSON(MENUKEY,menus);saveJSON(PLANKEY,plans);saveJSON(TEMPLATEKEY,templates);
  saveJSON(PROFILESKEY,profiles);saveJSON(PROFILEKEY,profiles[currentUserId]);
  saveJSON('kintoreAiAdviceHistory',aiAdviceHistory);
  localStorage.setItem(CURRENTUSERKEY,currentUserId);
  if(firebaseReady && !firebaseLoading) firebaseQueueSave();
}

function workoutUser(w){return w.userId||currentUserId}
function getRecord(date){
  let r=data[date]||{workouts:[],memo:''};
  let workouts=(r.workouts||[]).filter(w=>workoutUser(w)===currentUserId);
  let memo=r.memos&&Object.prototype.hasOwnProperty.call(r.memos,currentUserId)?r.memos[currentUserId]:(r.memos? '':(r.memo||''));
  return {workouts,memo};
}
function hasWorkout(date){return getRecord(date).workouts.length>0}
function hasMemo(date){return !!getRecord(date).memo}
function hasPlan(date){return !!plans[date]}
function showTab(t){state.tab=t;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();if(t==='analysis'&&typeof window.__finalAnalysisRender==='function')window.__finalAnalysisRender()}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>showTab(x.dataset.tab));

function render(){if(state.tab==='calendar')renderHome();if(state.tab==='menu')renderMenu();if(state.tab==='analysis')renderAnalysis();if(state.tab==='settings')renderSettings()}

function renderHome(){
  let el=document.getElementById('calendar');
  el.innerHTML=`<div class="card" style="position:relative;overflow:hidden"><div id="calendarSwipePage" class="calendar-swipe-page">${renderCalendar()}</div></div><div id="dayPreview"></div>`;
  renderHomePreview();
}
function isHolidayDate(ds){
  const holidays={
    '2026-01-01':1,'2026-01-12':1,'2026-02-11':1,'2026-02-23':1,'2026-03-20':1,'2026-04-29':1,'2026-05-03':1,'2026-05-04':1,'2026-05-05':1,'2026-05-06':1,'2026-07-20':1,'2026-08-11':1,'2026-09-21':1,'2026-09-22':1,'2026-09-23':1,'2026-10-12':1,'2026-11-03':1,'2026-11-23':1,
    '2027-01-01':1,'2027-01-11':1,'2027-02-11':1,'2027-02-23':1,'2027-03-21':1,'2027-03-22':1,'2027-04-29':1,'2027-05-03':1,'2027-05-04':1,'2027-05-05':1,'2027-07-19':1,'2027-08-11':1,'2027-09-20':1,'2027-09-23':1,'2027-10-11':1,'2027-11-03':1,'2027-11-23':1
  };
  return !!holidays[ds];
}
function renderCalendar(){
  let y=state.month.getFullYear(),m=state.month.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
  const monthDiff=monthlyCalorieDifference(y,m);
  const diffText=monthDiff===0?'0 kcal':(monthDiff>0?'+':'')+Math.round(monthDiff).toLocaleString()+' kcal';
  const diffClass=monthDiff<0?'month-diff over':'month-diff';
  let html=`<div class="calendar-head"><button class="sub" onclick="moveMonth(-1)">‹</button><div style="text-align:center"><b>${y}年${m+1}月</b><div class="${diffClass}">月間差異（消費−摂取）：${diffText}</div></div><button class="sub" onclick="moveMonth(1)">›</button></div><div class="calendar">`;
  ['日','月','火','水','木','金','土'].forEach(x=>html+=`<div class="dow">${x}</div>`);
  for(let i=0;i<first.getDay();i++)html+=`<div></div>`;
  for(let d=1;d<=last.getDate();d++){
    let dateObj=new Date(y,m,d),ds=localDate(dateObj),cls=(ds===state.date?' selected':'')+(dateObj.getDay()===6?' sat':'')+(dateObj.getDay()===0?' sun':'')+(isHolidayDate(ds)?' holiday':'');
    let marks=(hasWorkout(ds)?'🔥':'')+(hasPlan(ds)?' 📅':'')+(hasMemo(ds)?' 📝':'');
    const tdee=totalDailyExpenditure();
    const intake=mealTotals(ds).cal;
    const hasMeal=getMeals(ds).length>0;
    const rem=tdee?Math.round(tdee-intake):0;
    const remText=(hasMeal&&tdee)?`${rem.toLocaleString()}kcal`:'—';
    const remClass=rem<0?'day-remaining over':'day-remaining';
    html+=`<button class="day${cls}" onclick="openDate('${ds}')"><div class="daynum">${d}</div><div class="${remClass}">${remText}</div><div class="marks">${marks}</div></button>`;
  }
  html+='</div><div class="note" style="margin-top:8px">🔥記録　📅予定　📝メモ</div>';return html;
}
function openDate(d){state.date=d;render()}
function moveMonth(n){state.month.setMonth(state.month.getMonth()+n);render()}
let homeSwipeX=0,homeSwipeY=0,homeSwipeActive=false,homeSwipeDir=0,homeSwipeNext=null,homeSwipeMoved=false,homeSwipeIgnoreClick=false;
function monthCalendarHTML(monthObj){
  const prev=state.month;
  state.month=monthObj;
  const html=renderCalendar();
  state.month=prev;
  return html;
}
function clearHomeSwipeNext(){if(homeSwipeNext){homeSwipeNext.remove();homeSwipeNext=null}}
function beginHomeSwipe(page,t){
  const shell=page.parentElement;
  homeSwipeX=t.clientX;homeSwipeY=t.clientY;homeSwipeActive=true;homeSwipeDir=0;homeSwipeMoved=false;homeSwipeIgnoreClick=false;
  clearHomeSwipeNext();
  shell.style.position='relative';
  page.classList.add('dragging');
  page.style.transform='translate3d(0,0,0)';
}
document.addEventListener('touchstart',e=>{
  if(state.tab!=='calendar'||homeSwipeActive)return;
  const page=e.target.closest?.('#calendarSwipePage');
  if(!page||e.touches.length!==1)return;
  beginHomeSwipe(page,e.touches[0]);
},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{
  if(!homeSwipeActive||state.tab!=='calendar'||e.touches.length!==1)return;
  const page=document.getElementById('calendarSwipePage'),t=e.touches[0];if(!page||!t)return;
  const dx=t.clientX-homeSwipeX,dy=t.clientY-homeSwipeY;
  if(!homeSwipeDir){
    if(Math.abs(dx)<6)return;
    if(Math.abs(dy)>Math.abs(dx)*1.15){homeSwipeActive=false;page.classList.remove('dragging');return}
    homeSwipeDir=dx<0?1:-1;homeSwipeMoved=true;
    const shell=page.parentElement,width=shell.getBoundingClientRect().width||window.innerWidth;
    const nextMonth=new Date(state.month.getFullYear(),state.month.getMonth()+homeSwipeDir,1);
    const div=document.createElement('div');
    div.id='calendarSwipeNext';div.className='calendar-swipe-page dragging';
    div.style.position='absolute';div.style.inset='0';div.style.width='100%';
    div.style.transform=`translate3d(${homeSwipeDir*width}px,0,0)`;
    div.innerHTML=monthCalendarHTML(nextMonth);shell.appendChild(div);homeSwipeNext=div;
  }
  e.preventDefault();
  const shell=page.parentElement,width=shell.getBoundingClientRect().width||window.innerWidth;
  const clamped=Math.max(-width,Math.min(width,dx));
  page.style.transform=`translate3d(${clamped}px,0,0)`;
  if(homeSwipeNext)homeSwipeNext.style.transform=`translate3d(${homeSwipeDir*width+clamped}px,0,0)`;
},{passive:false,capture:true});
document.addEventListener('touchend',e=>{
  if(!homeSwipeActive||state.tab!=='calendar')return;
  const page=document.getElementById('calendarSwipePage'),t=e.changedTouches?.[0];
  homeSwipeActive=false;
  if(!page||!t){clearHomeSwipeNext();return}
  const dx=t.clientX-homeSwipeX,dy=t.clientY-homeSwipeY,width=page.parentElement?.getBoundingClientRect().width||window.innerWidth;
  const commit=homeSwipeDir&&Math.abs(dx)>Math.abs(dy)*1.05&&Math.abs(dx)>=width*0.20&&homeSwipeNext;
  if(commit){
    homeSwipeIgnoreClick=true;
    page.classList.remove('dragging');homeSwipeNext.classList.remove('dragging');page.classList.add('leaving');homeSwipeNext.classList.add('entering');
    page.style.transform=`translate3d(${-homeSwipeDir*width}px,0,0)`;homeSwipeNext.style.transform='translate3d(0,0,0)';
    const dir=homeSwipeDir;
    setTimeout(()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+dir,1);render();homeSwipeIgnoreClick=false;},190);
  }else{
    page.classList.remove('dragging');page.classList.add('leaving');page.style.transform='translate3d(0,0,0)';
    if(homeSwipeNext)homeSwipeNext.style.transform=`translate3d(${homeSwipeDir*width}px,0,0)`;
    setTimeout(()=>{clearHomeSwipeNext();page.classList.remove('leaving')},220);
  }
  homeSwipeDir=0;
},{passive:true,capture:true});
// iOS Safari等でtouchendが来ない場合もスワイプ状態を確実に解除
document.addEventListener('touchcancel',e=>{
  if(!homeSwipeActive)return;
  const page=document.getElementById('calendarSwipePage');
  homeSwipeActive=false;homeSwipeDir=0;
  if(page){page.classList.remove('dragging','leaving');page.style.transform='translate3d(0,0,0)'}
  clearHomeSwipeNext();
},{passive:true,capture:true});
// スワイプ直後の疑似クリックで日付を開かない
 document.addEventListener('click',e=>{if(homeSwipeIgnoreClick){e.preventDefault();e.stopPropagation();homeSwipeIgnoreClick=false}},true);

function renderHomePreview(){
  let el=document.getElementById('dayPreview');
  el.innerHTML=`<div class="card"><h2>${formatDate(state.date)}</h2><div class="home-preview-tabs"><button class="home-tab active" data-home-tab="workout" onclick="setHomePreviewTab('workout')">🏋️ 筋トレ</button><button class="home-tab" data-home-tab="meal" onclick="setHomePreviewTab('meal')">🍚 食事</button><button class="home-tab" data-home-tab="photo" onclick="setHomePreviewTab('photo')">📸 身体</button></div><div id="homePreviewContent"></div><div id="homePreviewActions" class="row" style="margin-top:10px"></div></div>`;
  setHomePreviewTab(state.homePreviewTab||'workout');
}
function setHomePreviewTab(tab){
  state.homePreviewTab=tab;
  document.querySelectorAll('.home-tab').forEach(b=>b.classList.toggle('active',b.dataset.homeTab===tab));
  const el=document.getElementById('homePreviewContent'); if(!el)return;
  const actions=document.getElementById('homePreviewActions');
  if(tab==='workout'){renderHomeWorkoutPreview(el);actions.innerHTML=`<button onclick="addWorkout()">＋記録</button><button class="sub" onclick="openDayMemoModal()">📝 メモ追加</button>`;}
  else if(tab==='meal'){renderHomeMealPreview(el);actions.innerHTML=`<button onclick="openMealAddModal()">🍚 食事を追加</button>`;}
  else {renderHomePhotoPreview(el);actions.innerHTML=`<button onclick="openPhotoSourceModal()">📸 写真を追加</button>`;}
}
function renderHomeWorkoutPreview(el){
  let r=getRecord(state.date),html='';
  if(r.workouts.length)r.workouts.forEach((w,i)=>html+=homeWorkoutHTML(w,i));
  else if(!hasPlan(state.date))html+=`<div class="empty">この日の筋トレ記録はありません</div>`;
  if(r.memo)html+=`<div class="section-title">その日のメモ</div><div class="memo">${esc(r.memo)}</div>`;
  el.innerHTML=html;
}
function getMeals(date){
  const r=data[date]||{};
  return Array.isArray(r.meals)?r.meals.filter(x=>(x.userId||currentUserId)===currentUserId):[];
}
function mealTotals(date){
  return getMeals(date).reduce((a,m)=>{a.cal+=parseFloat(m.cal)||0;a.p+=parseFloat(m.p)||0;a.f+=parseFloat(m.f)||0;a.c+=parseFloat(m.c)||0;return a},{cal:0,p:0,f:0,c:0});
}
function getHomePfcTargets(){
  const p=profiles[currentUserId]||profile||{};
  const tdee=totalDailyExpenditure();
  const goals={strength:{p:25,f:25,c:50},fatloss:{p:40,f:20,c:40},performance:{p:20,f:25,c:55}};
  const g=goals[p.goal]||goals.fatloss;
  return {p:tdee*g.p/100/4,f:tdee*g.f/100/9,c:tdee*g.c/100/4,pp:g.p,fp:g.f,cp:g.c};
}
function renderHomeMealPreview(el){
  const meals=getMeals(state.date),t=mealTotals(state.date),target=getHomePfcTargets(),tdee=totalDailyExpenditure();
  let h=`<div class="macro-bar-card">
    <h3>当日の摂取状況</h3>
    <div class="macro-legend-note">黒いライン＝目標値　／　バー＝現在の摂取量</div>
    <div class="home-macro-bars" id="homeMacroBars"></div>
  </div>`;
  h+=`<div class="card home-pfc-card"><h3 style="margin:4px 0 10px">P・F・Cバランス</h3><div class="home-pfc-wrap"><canvas id="homeMealPfcBalance" width="220" height="220"></canvas><div id="homeMealPfcLegend" class="home-pfc-legend"></div></div></div>`;
  if(!meals.length) h+=`<div class="empty">この日の食事記録はまだありません</div>`;
  else meals.forEach((m,i)=>{h+=`<div class="food-item"><div class="food-item-head"><span>${esc(m.type)}：${esc(m.name||'食事')}</span><span>${m.cal?esc(m.cal)+' kcal':'—'}</span></div>${m.photoData?`<img src="${esc(m.photoData)}" style="width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:#eee;margin-top:7px">`:''}<div class="food-macros">P ${m.p?esc(m.p):'0'}g　F ${m.f?esc(m.f):'0'}g　C ${m.c?esc(m.c):'0'}g</div>${m.items?.length?`<div class="food-memo">${m.items.filter(x=>x.name).map(x=>esc(x.name)+(x.amount?' '+esc(x.amount)+'g':'')).join(' / ')}</div>`:''}${m.memo?`<div class="food-memo">${esc(m.memo)}</div>`:''}<div style="margin-top:6px"><button class="sub" onclick="editMeal(${i})">✏️ 編集</button><button class="sub" onclick="deleteMeal(${i})">🗑️ 削除</button></div></div>`});
  el.innerHTML=h;
  drawHomeMacroBars(t,tdee,target);
  drawHomeMealPfcBalance(t,target);
}
function drawHomeMacroBars(t,tdee,target){
  const el=document.getElementById('homeMacroBars'); if(!el)return;
  const rows=[
    {label:'カロリー',actual:+t.cal||0,target:+tdee||0,unit:'kcal',key:'cal'},
    {label:'P（タンパク質）',actual:+t.p||0,target:+target.p||0,unit:'g',key:'p'},
    {label:'F（脂肪）',actual:+t.f||0,target:+target.f||0,unit:'g',key:'f'},
    {label:'C（炭水化物）',actual:+t.c||0,target:+target.c||0,unit:'g',key:'c'}
  ];
  el.innerHTML=rows.map(r=>{
    const scale=Math.max((r.target||0)/0.70,(r.actual||0)*1.05,1);
    const fill=Math.min(100,(r.actual/scale)*100);
    const marker=r.target>0?Math.min(70,(r.target/scale)*100):0;
    const actualText=`${Math.round(r.actual*10)/10}${r.unit}`;
    const targetText=r.target>0?`目標 ${Math.floor(r.target)}${r.unit}`:'目標 —';
    return `<div class="macro-row"><div class="macro-head"><span>${r.label}</span></div><div class="macro-track"><div class="macro-fill" style="width:${fill}%;background:${r.key==='cal'?'#555':r.key==='p'?'#2f6fed':r.key==='f'?'#e34b4b':'#2f9e44'}"></div>${r.target>0?`<div class="macro-target-line" style="left:${marker}%"><div class="macro-target-label">${targetText}</div></div>`:''}<div class="macro-actual-label">${actualText}</div></div></div>`;
  }).join('');
}
function drawHomeMealPfcBalance(t,target){
  const c=document.getElementById('homeMealPfcBalance'),leg=document.getElementById('homeMealPfcLegend'); if(!c)return;
  const vals=[Math.max(0,(+t.p||0)*4),Math.max(0,(+t.f||0)*9),Math.max(0,(+t.c||0)*4)];
  const total=vals.reduce((a,b)=>a+b,0),d=devicePixelRatio||1,size=220;
  c.width=size*d;c.height=size*d;c.style.width=size+'px';c.style.height=size+'px';
  const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,size,size);
  const cx=110,cy=110,r=86,colors=['#2f6fed','#e34b4b','#2f9e44'],labels=['P','F','C'];
  if(!total){ctx.fillStyle='#e5e7eb';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#666';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('記録なし',cx,cy+5);if(leg)leg.innerHTML=`<div><span class="home-pfc-dot" style="background:${colors[0]}"></span>P（タンパク質） —　<span class="pfc-target">目標 ${Math.floor(target.pp||0)}%</span></div><div><span class="home-pfc-dot" style="background:${colors[1]}"></span>F（脂肪） —　<span class="pfc-target">目標 ${Math.floor(target.fp||0)}%</span></div><div><span class="home-pfc-dot" style="background:${colors[2]}"></span>C（炭水化物） —　<span class="pfc-target">目標 ${Math.floor(target.cp||0)}%</span></div>`;return;}
  let ang=-Math.PI/2;
  vals.forEach((v,i)=>{if(v<=0)return;const span=v/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,ang,ang+span);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();const pct=Math.round(v/total*100);if(span>.20){const mid=ang+span/2;ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(`${labels[i]} ${pct}%`,cx+Math.cos(mid)*r*.62,cy+Math.sin(mid)*r*.62);}ang+=span;});
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#333';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('PFC',cx,cy);
  const cur=[total?Math.round(vals[0]/total*100):0,total?Math.round(vals[1]/total*100):0,total?Math.round(vals[2]/total*100):0],tar=[target.pp||0,target.fp||0,target.cp||0],grams=[t.p,t.f,t.c];

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(',')[1]||'');
    r.onerror=reject;r.readAsDataURL(file);
  });
}
async function geminiFetchWithRetry(url,options,maxRetries=4){
  let lastError='';
  for(let attempt=0;attempt<=maxRetries;attempt++){
    try{
      const res=await fetch(url,options);
      if(res.ok)return res;
      const text=await res.text();
      let msg='';
      try{msg=JSON.parse(text)?.error?.message||''}catch(_){}
      const retryable=[408,429,500,502,503,504].includes(res.status);
      lastError='API error '+res.status+(msg?'：'+msg:'');
      if(!retryable || attempt===maxRetries){
        throw new Error(lastError);
      }
      const delay=Math.min(12000,2000*Math.pow(2,attempt))+Math.floor(Math.random()*700);
      await new Promise(r=>setTimeout(r,delay));
    }catch(e){
      if(attempt===maxRetries)throw e;
      const msg=String(e?.message||e||'');
      if(msg.startsWith('API error ') && !/API error (408|429|500|502|503|504)(?:：|$)/.test(msg))throw e;
      const delay=Math.min(12000,2000*Math.pow(2,attempt))+Math.floor(Math.random()*700);
      await new Promise(r=>setTimeout(r,delay));
    }
  }
  throw new Error(lastError||'Gemini APIへの接続に失敗しました。');
}

async function analyzeMealPhoto(){
  syncMealDraft();
  const file=mealDraftPhoto||document.getElementById('mealPhoto')?.files?.[0];
  if(!file){alert('先に食事画像を選択してください');return}
  const key=getGeminiApiKey();
  if(!key){
    alert('食事AIを使うにはGemini APIキーの設定が必要です。AI設定から登録してください。');
    openFoodAISettings();return;
  }
  if(file.size>18*1024*1024){alert('画像が大きすぎます。18MB未満の画像を使用してください。');return}
  const btn=document.getElementById('mealAIButton');if(btn){btn.disabled=true;btn.textContent='🤖 判定中…（混雑時は自動再試行）';}
  try{
    const b64=await fileToBase64(file);
    const mime=file.type||'image/jpeg';
    const prompt=`あなたは食事記録アシスタントです。この料理写真を見て、写っている食べ物をできるだけ具体的に推定してください。
目的はカロリーとPFC管理です。画像だけでは正確な重量が分からないため、一般的な一人前として妥当な推定量(g)を設定してください。

必ずJSONだけを返してください。Markdownや説明文は不要です。
形式:
{"items":[{"name":"食品名","amount":100,"cal":168,"p":2.5,"f":0.3,"c":37.1}]}
calはkcal、p/f/cはg。数値は推定値で、確信が低い場合も妥当な範囲の値を入れてください。`;
    const res=await geminiFetchWithRetry('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:mime,data:b64}}]}],
        generationConfig:{responseMimeType:'application/json',temperature:0.2}})
    });
    const json=await res.json();
    const raw=json?.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('')||'';
    if(!raw) throw new Error('Geminiから判定結果が返りませんでした。');
    const cleaned=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();

    }catch(parseErr){
      const s=cleaned.indexOf('{'),e=cleaned.lastIndexOf('}');
      if(s>=0&&e>s) parsed=JSON.parse(cleaned.slice(s,e+1));

    }
    if(!Array.isArray(parsed.items)||!parsed.items.length)throw new Error('判定結果なし');
    mealDraftItems=parsed.items.map(x=>({
      name:String(x.name||''),

      p:String((Number(x.p)||0).toFixed(1)),
      f:String((Number(x.f)||0).toFixed(1)),
      c:String((Number(x.c)||0).toFixed(1))
    }));
    renderMealRowsOnly();updateMealDraftSummary();
    const status=document.getElementById('mealAIStatus');if(status)status.innerHTML='🤖 AI推定を反映しました。<b>必ず内容・量・数値を確認してから保存してください。</b>';
  }catch(e){

    alert('AI判定に失敗しました。\n'+(e?.message||'APIキー、通信状態、画像形式を確認してください。'));
  }finally{if(btn){btn.disabled=false;btn.textContent='🤖 画像からAI推定';}}
}

async function compressBodyPhoto(file){
  const dataUrl=await new Promise((resolve,reject)=>{
    const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
  });
  const img=await new Promise((resolve,reject)=>{
    const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=dataUrl;
  });
  const maxSide=1000;
  const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
  let q=.72, out=c.toDataURL('image/jpeg',q);
  while(out.length>720000 && q>.45){q-=.06;out=c.toDataURL('image/jpeg',q)}
  return out;
}

  const factor=key==='プロテイン'?n:n/100;

}

function calcPersonalBmrTop(){
  const p=profiles[currentUserId]||profile||{};
  const sex=p.sex||p.gender||'';
  const age=Number(p.age)||0,height=Number(p.height)||0,weight=Number(p.weight)||0;
  const manual=Number(p.manualBmr)||0;
  if(manual>0)return manual;
  if((sex==='男性'||sex==='male')&&age>0&&height>0&&weight>0)return 88.362+(13.397*weight)+(4.799*height)-(5.677*age);
  if((sex==='女性'||sex==='female')&&age>0&&height>0&&weight>0)return 447.593+(9.247*weight)+(3.098*height)-(4.330*age);
  return 0;
}
function totalDailyExpenditure(){
  const p=profiles[currentUserId]||profile||{};
  const bmr=calcPersonalBmrTop();
  const factors={sedentary:1.2,light:1.375,moderate:1.55,high:1.725,veryhigh:1.9};
  const factor=factors[p.activityLevel||p.activity]||1.55;
  return bmr>0?bmr*factor:0;
}
function isThreeMealDay(date){
  const ms=getMeals(date);
  return ['朝食','昼食','夕食'].every(t=>ms.some(m=>m.type===t));

function dailyCalorieDifference(date){
  if(!isThreeMealDay(date))return 0;
  const tdee=totalDailyExpenditure();
  if(!tdee)return 0;
  return tdee-mealTotals(date).cal;
}
function monthlyCalorieDifference(year,monthIndex){
  const last=new Date(year,monthIndex+1,0).getDate();
  let total=0;
  for(let d=1;d<=last;d++){
    total+=dailyCalorieDifference(localDate(new Date(year,monthIndex,d)));
  }
  return total;
}

async function loginWithGoogle(){

  loginInProgress=true;
  const btn=document.getElementById('loginBtn');
  if(btn){btn.disabled=true;btn.textContent='Googleログイン中…';}

    await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});

    setLoginStatus('');

    console.error('Google login error:',e);
    const code=e&&e.code?e.code:'unknown';

      setLoginStatus('Googleログイン処理が重複したためキャンセルされました。もう一度押してください。');

    }else if(code==='auth/unauthorized-domain'){

      setLoginStatus('Googleログイン画面が閉じられました。');

  if(o.profiles && typeof o.profiles==='object' && Object.keys(o.profiles).length) profiles=o.profiles;
  if(o.aiAdviceHistory && typeof o.aiAdviceHistory==='object') aiAdviceHistory=o.aiAdviceHistory;

  if(!profiles[currentUserId]){
    currentUserId=Object.keys(profiles)[0]||currentUserId;
  }
  profile=profiles[currentUserId]||{id:currentUserId,name:'利用者',height:'',weight:''};
  migrateUserData();
  saveJSON(MENUKEY,menus);saveJSON(PLANKEY,plans);saveJSON(TEMPLATEKEY,templates);
  saveJSON(PROFILESKEY,profiles);saveJSON(PROFILEKEY,profile);
  localStorage.setItem(CURRENTUSERKEY,currentUserId);
}

async function loadBodyPhotosCloud(){
  if(!fbDb || !fbAuth || !fbAuth.currentUser || !window.v26BodyPhotos)return;
  try{
    const uid=fbAuth.currentUser.uid;
    const snap=await fbDb.collection('shared').doc(FIREBASE_APP_ID).collection('bodyPhotos')
      .where('userId','==',uid).get();
    const cloud=[];
    snap.forEach(doc=>cloud.push(doc.data()));
    if(cloud.length){
      const local=window.v26BodyPhotos.get();
      const map=new Map(local.map(x=>[x.id,x]));
      cloud.forEach(x=>map.set(x.id,x));
      window.v26BodyPhotos.set([...map.values()].sort((a,b)=>(a.date||'').localeCompare(b.date||'')));
    }
  }catch(e){
    console.warn('body photo cloud load:',e);
  }
}

async function loadCloud(){
  if(!fbDb)return;
  firebaseLoading=true;
  const ref=fbDb.collection('shared').doc(FIREBASE_APP_ID);
  // Authentication成功後は、Firestoreの設定状態に関係なく
  // まずアプリ本体を表示する。Firestoreは後から接続する。
  firebaseReady=true;
  try{
    const snap=await ref.get();
    if(snap.exists){
      applyCloudSnapshot(snap.data());
    }else{
      await ref.set(sharedPayload(),{merge:false});
    }

    await loadBodyPhotosCloud();
    if(firebaseUnsub)firebaseUnsub();firebaseUnsub=ref.onSnapshot(s=>{
      if(!s.exists || firebaseSaving)return;
      const o=s.data();
      if(o && o.updatedBy===currentUserId)return;
      firebaseLoading=true;
      try{applyCloudSnapshot(o);render();}finally{firebaseLoading=false;}
    },e=>{
      console.error('Firebase realtime error',e);
      console.log('Firestoreのルール設定後にリアルタイム共有が有効になります。');
    });
  }catch(e){
    console.error('Firebase load error',e);
    // ログイン画面には戻さない。現在端末のデータでアプリを使用可能にする。
    console.log('Firestore接続待ち:', e && e.code ? e.code : e);
  }finally{
    firebaseLoading=false;
  }
}

function addFirebaseUserName(){
  // Keep the Google user's display name available as a selectable profile.
  const user=fbAuth&&fbAuth.currentUser;
  if(!user)return;
  if(!profiles[user.uid]){
    profiles[user.uid]={
      id:user.uid,
      name:user.displayName||user.email||'利用者',
      height:'',
      weight:'',
      visibility:{workout:true,food:false,photo:false}
    };
    currentUserId=user.uid;
    profile=profiles[currentUserId];
    migrateUserData();
    saveAll();
  }
}

async function startFirebase(){
  if(!fbAuth)return;

  try{
    await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  }catch(e){
    console.warn('Auth persistence:',e);
  }

  fbAuth.onAuthStateChanged(async user=>{
    if(!user){
      firebaseReady=false;
      showLogin(true);
      setLoginStatus('');
      return;
    }

    // 認証済みなら、Firestoreの読み込みを待たずにアプリ本体を表示。
    showLogin(false);
    setLoginStatus('');

    try{
      addFirebaseUserName();
      render();
      await loadCloud();
      render();
    }catch(e){
      console.error('Firebase startup error',e);
      showLogin(false);
      render();
    }
  });

  // iOSホーム画面のWebアプリでは、認証後の戻り処理が
  // 通常ブラウザと異なることがあるため、redirect結果は安全に確認する。
  try{
    const result=await fbAuth.getRedirectResult();
    if(result && result.user){
      console.log('Google redirect login completed');
    }
  }catch(e){
    console.error('Google redirect error:',e);
    const code=e&&e.code?e.code:'unknown';
    if(code!=='auth/no-auth-event' && code!=='auth/popup-closed-by-user'){
      console.warn('Google auth result:',code);
    }
  }
}
startFirebase();

render();
</script>
<script>
(function(){
  const HOLIDAYS={
    "2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日",
    "2026-02-23":"天皇誕生日","2026-03-20":"春分の日","2026-04-29":"昭和の日",
    "2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日",
    "2026-05-06":"振替休日","2026-07-20":"海の日","2026-08-11":"山の日",
    "2026-09-21":"敬老の日","2026-09-22":"休日","2026-09-23":"秋分の日",
    "2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日",
    "2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日",
    "2027-02-23":"天皇誕生日","2027-03-21":"春分の日","2027-03-22":"振替休日",
    "2027-04-29":"昭和の日","2027-05-03":"憲法記念日","2027-05-04":"みどりの日",
    "2027-05-05":"こどもの日","2027-07-19":"海の日","2027-08-11":"山の日",
    "2027-09-20":"敬老の日","2027-09-23":"秋分の日","2027-10-11":"スポーツの日",
    "2027-11-03":"文化の日","2027-11-23":"勤労感謝の日"
  };

  function decorate(){
    const title=[...document.querySelectorAll("body *")].find(e=>/^20\d{2}年\d{1,2}月$/.test((e.textContent||"").trim()));
    if(!title) return;
    const m=(title.textContent||"").trim().match(/^(20\d{2})年(\d{1,2})月$/);
    if(!m) return;
    const year=+m[1], month=+m[2];
    document.querySelectorAll(".day").forEach(cell=>{
      cell.classList.remove("sat","sun","holiday");
      const numEl=cell.querySelector(".daynum");
      const mt=(numEl?.textContent||"").trim().match(/^(\d{1,2})$/);
      if(!mt) return;
      const day=+mt[1];
      if(day<1 || day>31) return;
      const d=new Date(year,month-1,day);
      if(d.getMonth()!==month-1) return;
      const iso=year+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
      if(HOLIDAYS[iso]) cell.classList.add("holiday");
      else if(d.getDay()===0) cell.classList.add("sun");
      else if(d.getDay()===6) cell.classList.add("sat");
    });
  }

  new MutationObserver(decorate).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("click",()=>setTimeout(decorate,50));
  setTimeout(decorate,100);
  setTimeout(decorate,500);
  setTimeout(decorate,1500);
})();
</script>

<script>
(function(){
  const PREFIX='kintoreUserData_';
  const OLD='kintoreData';

  function user(){
    try{return window.fbAuth&&window.fbAuth.currentUser?window.fbAuth.currentUser:null}catch(e){return null}
  }
  function read(k,f){
    try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}
  }
  function write(k,v){
    try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){console.warn(e);return false}
  }
  function migrate(){
    const u=user(); if(!u)return;
    const k=PREFIX+u.uid;
    if(localStorage.getItem(k)===null){
      const old=read(OLD,null);
      write(k,old===null?{}:old);
    }
  }
  function accountBar(){
    let bar=document.getElementById('accountBarV2');
    if(!bar){
      bar=document.createElement('div');
      bar.id='accountBarV2';
      const target=document.querySelector('header')||document.body.firstElementChild||document.body;
      if(getComputedStyle(target).position==='static')target.style.position='relative'; target.appendChild(bar);
    }
    const u=user();
    if(!u){bar.innerHTML='<span>ログインしていません</span>';return}
    const name=(u.displayName||'Googleユーザー').replace(/[<>]/g,'');
    const email=(u.email||'').replace(/[<>]/g,'');
    bar.innerHTML='<div><span>👤</span><span class="account-name">'+name+'</span></div>'+
      '<button type="button" id="accountLogoutV2" aria-label="ログアウト" title="ログアウト">↪ ログアウト</button>';

    if(b)b.onclick=async function(){
      try{if(window.fbAuth)await window.fbAuth.signOut()}catch(e){console.error(e)}
    };
  }

  window.kintoreUserDataV2={
    getUser:function(){return user()},
    getKey:function(){const u=user();return u?PREFIX+u.uid:null},
    load:function(){const u=user();if(!u)return null;migrate();return read(PREFIX+u.uid,{})},
    save:function(data){const u=user();return u?write(PREFIX+u.uid,data):false},
    migrate:migrate
  };

  function hook(){
    if(window.fbAuth&&window.fbAuth.onAuthStateChanged){
      window.fbAuth.onAuthStateChanged(function(u){if(u)migrate();accountBar()});
      accountBar(); return true;
    }
    return false;
  }
  let n=0;
  const t=setInterval(function(){if(hook()||++n>40)clearInterval(t)},250);
})();
</script>

  function stop(){A.playing=false;if(A.raf)cancelAnimationFrame(A.raf);A.raf=null;A.last=0;const b=document.getElementById('a10play');if(b)b.textContent='▶️ 再生'}
  function tick(ts){if(!A.playing)return;const sp=parseFloat(document.getElementById('a10speed')?.value||1),last=A.last||ts;A.last=ts;A.pos+=Math.max(0,ts-last)*0.06*sp;if(A.pos>1000)A.pos=0;const s=document.getElementById('a10seek');if(s)s.value=A.pos;drawMorph();A.raf=requestAnimationFrame(tick)}
  function renderAnalysisV10(){

    let h=`<div class="card"><h2>分析</h2><div class="analysis-v10-tabs"><button class="analysis-v10-tab ${A.section==='workout'?'active':''}" data-s="workout">🏋️ 筋トレ</button><button class="analysis-v10-tab ${A.section==='meal'?'active':''}" data-s="meal">🍚 食事</button><button class="analysis-v10-tab ${A.section==='body'?'active':''}" data-s="body">📸 身体</button></div>`;

    if(A.section==='body'){document.getElementById('a10orient')?.addEventListener('change',e=>{A.orientation=e.target.value;A.pos=0;drawMorph()});document.getElementById('a10seek')?.addEventListener('input',e=>{A.pos=+e.target.value;drawMorph()});document.getElementById('a10play')?.addEventListener('click',()=>{if(A.playing)stop();else{A.playing=true;document.getElementById('a10play').textContent='⏸️ 停止';A.last=0;requestAnimationFrame(tick)}});drawMorph()}

(function(){

if(S.tab==='workout'){

  function workout(){
    const os=opts();
    const [cmA,cmB]=currentMonthRange();
    let _days=new Set(),_sets=0,_vol=0;
    Object.entries(data||{}).forEach(([date,rec])=>{
      if(date<cmA||date>cmB||!rec)return;
      const list=Array.isArray(rec.exercises)?rec.exercises:(Array.isArray(rec.workouts)?rec.workouts:[]);
      let dayHas=false;
      list.forEach(ex=>{
        const sets=Array.isArray(ex.sets)?ex.sets:[];
        sets.forEach(st=>{
          const weight=Number(st.weight)||0;
          const reps=Number(st.reps)||0;

    let h=`<div class="analysis-v10-kpis">

      <div class="analysis-v10-kpi"><span>今月総負荷量</span><b>${Math.round(s.vol).toLocaleString()} kg</b></div>
    </div>`;

    const yearText=S.unit==='month'
      ? `<div class="v35-chart-year">${new Date().getFullYear()}年</div>`
      : '';

    h+=`<div class="analysis-v10-card">
      <h3>種目別重量推移</h3>
      ${yearText}

        <div style="flex:1">

        </div>
        <div style="flex:1">
          <label>種目</label>
          <select id="afixEx"><option value="">種目を選択</option>${exOptions}</select>
        </div>
      </div>
      <div class="row" style="margin-top:8px">
        <div style="flex:1">
          <label>表示単位</label>
          <select id="afixUnit">
            <option value="day" ${S.unit==='day'?'selected':''}>日別</option>
            <option value="month" ${S.unit==='month'?'selected':''}>月別</option>
            <option value="year" ${S.unit==='year'?'selected':''}>年別</option>
          </select>
        </div>
      </div>
      <canvas id="afixChart" style="width:100%;height:290px;display:block"></canvas>
      <div class="note">各期間の最大重量（kg）を折れ線で表示します。日別は1〜31日固定、月別は1〜12月です。</div>
    </div>`;

    const [a,b]=currentMonthRange();
    const bc=safe(()=>bodyPartCounts(currentUserId,a,b),{}),bv=safe(()=>bodyPartVolumes(currentUserId,a,b),{});
    h+=`<div class="analysis-v10-card"><h3>当月の部位別・回数／負荷量</h3>
      <table class="analysis-v10-table"><tr><th>部位</th><th>回数</th><th>負荷量</th></tr>

      ${hist.map(m=>{const [x,y]=periodRange(m,'month'),v=bodyPartVolumes(currentUserId,x,y);return `<tr><td>${m.replace('-','/')}</td>${cats.map(c=>`<td>${Math.round(v[c]||0).toLocaleString()}</td>`).join('')}</tr>`}).join('')}</table></div>
      <div class="note">単位：kg（重量×回数）</div>

    return h;

  function currentMonthDaySlots31(){const now=new Date(),y=now.getFullYear(),m=now.getMonth();return Array.from({length:31},(_,i)=>{const d=new Date(y,m,i+1);return i+1<=new Date(y,m+1,0).getDate()?localDate(d):null;});}
    function draw(){
    const c=document.getElementById('afixChart');
    if(!c||!S.exercise)return;
    const ex=opts().find(x=>x.key===S.exercise);
    if(!ex)return;

    let ps=[];
    if(S.unit==='day'){
      ps=currentMonthDaySlots31();
    }else if(S.unit==='month'){
      const y=new Date().getFullYear();
      ps=Array.from({length:12},(_,i)=>`${y}-${String(i+1).padStart(2,'0')}`);
    }else{
      ps=periodList('year',5);
    }

    const vals=ps.map(p=>{
      if(!p)return null;
      const range=S.unit==='day'?[p,p]:periodRange(p,S.unit);
      const v=maxWeight(currentUserId,ex.cat,ex.exercise,range[0],range[1]);
      return (v==null||Number.isNaN(Number(v)))?null:Number(v);
    });

    const rect=c.getBoundingClientRect();
    const w=Math.max(320,rect.width||320),h=290,d=window.devicePixelRatio||1;
    c.width=Math.round(w*d);
    c.height=Math.round(h*d);
    c.style.width=w+'px';
    c.style.height=h+'px';

    const ctx=c.getContext('2d');
    ctx.setTransform(d,0,0,d,0,0);
    ctx.clearRect(0,0,w,h);

    const nums=vals.filter(v=>v!=null);
    if(!nums.length){
      ctx.fillStyle='#666';
      ctx.font='14px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('この期間の記録がありません',w/2,h/2);
      return;
    }

    const maxV=Math.max(...nums),minV=Math.min(...nums);
    const span=Math.max(1,maxV-minV);
    const hi=maxV+Math.max(2,span*0.15);
    const lo=Math.max(0,minV-Math.max(2,span*0.15));
    const L=52,R=14,T=18,B=44,pw=w-L-R,ph=h-T-B;
    const xFor=i=>L+(ps.length<=1?pw/2:pw*i/(ps.length-1));
    const yFor=v=>T+ph*(1-(v-lo)/(hi-lo));

    ctx.font='11px sans-serif';
    ctx.textAlign='right';
    ctx.fillStyle='#666';
    ctx.strokeStyle='#ddd';
    ctx.lineWidth=1;

    for(let i=0;i<=4;i++){
      const yy=T+ph*i/4;
      const vv=hi-(hi-lo)*i/4;
      ctx.beginPath();
      ctx.moveTo(L,yy);
      ctx.lineTo(w-R,yy);
      ctx.stroke();
      ctx.fillText(`${Math.round(vv*10)/10} kg`,L-6,yy+4);
    }

    // ここが「折れ線」。記録点を順番につないで1本の線として描画。
    const pts=[];
    vals.forEach((v,i)=>{
      if(v!=null)pts.push([i,v]);
    });

    ctx.strokeStyle='#1f77b4';
    ctx.lineWidth=2.5;
    ctx.lineJoin='round';
    ctx.lineCap='round';
    ctx.beginPath();
    pts.forEach(([i,v],j)=>{
      const xx=xFor(i),yy=yFor(v);
      if(j===0)ctx.moveTo(xx,yy);
      else ctx.lineTo(xx,yy);
    });
    ctx.stroke();

    ctx.fillStyle='#1f77b4';
    pts.forEach(([i,v])=>{
      ctx.beginPath();
      ctx.arc(xFor(i),yFor(v),3,0,Math.PI*2);
      ctx.fill();
    });

    ctx.fillStyle='#222';
    ctx.textAlign='center';
    ctx.font='11px sans-serif';
    ps.forEach((p,i)=>{
      if(!p)return;
      const xx=xFor(i);
      let label='';
      if(S.unit==='day')label=analysisPeriodLabel(p,'day');
      else if(S.unit==='month')label=`${new Date(p+'-01T00:00:00').getMonth()+1}月`;
      else label=periodLabel(p,S.unit);
      const show=S.unit==='day'
        ? (i===0||[4,9,14,19,24,29,30].includes(i))
        : true;
      if(show)ctx.fillText(label,xx,h-16);
    });
  }




  const V36_ACTIVITY_LEVELS=[
    {key:'sedentary',label:'低運動量（座りがち）',factor:1.2},

  ];
  const V36_GOALS=[
    {key:'strength',label:'筋力増強',p:25,f:25,c:50},
    {key:'fatloss',label:'体脂肪の減少',p:40,f:20,c:40},

  function v36Personal(){
    const p=profiles[currentUserId]||{};
    const sex=p.sex||p.gender||'';
    const age=Number(p.age)||0;
    const height=Number(p.height)||0;
    const weight=Number(p.weight)||0;
    const activity=p.activityLevel||p.activity||'moderate';
    const goal=p.goal||'fatloss';
    const act=V36_ACTIVITY_LEVELS.find(x=>x.key===activity)||V36_ACTIVITY_LEVELS[2];
    const gl=V36_GOALS.find(x=>x.key===goal)||V36_GOALS[1];
    let calcBmr=0;
    if(sex==='男性' && weight>0 && height>0 && age>0) calcBmr=88.362+(13.397*weight)+(4.799*height)-(5.677*age);
    else if(sex==='女性' && weight>0 && height>0 && age>0) calcBmr=447.593+(9.247*weight)+(3.098*height)-(4.330*age);
    const storedManual=Number(p.manualBmr)||0;
    const legacyManual=Number(p.bmr)||0;
    const manualBmr=storedManual>0?storedManual:((p.bmrMode==='manual'&&legacyManual>0)?legacyManual:0);
    const bmr=manualBmr>0?manualBmr:calcBmr;
    const tdee=bmr>0?bmr*act.factor:0;
    const kcal={p:tdee*gl.p/100,f:tdee*gl.f/100,c:tdee*gl.c/100};
    return {p,sex,age,height,weight,activity,goal,act,gl,calcBmr,bmr,manualBmr,tdee,kcal};
  }

        <div class="v36-personal-pfc"><b>目標PFCバランス</b>
          <div class="v36-pfc-grid">
            <div>P <span id="v36GoalPctP">${q.gl.p}%</span><small id="v36TargetP">${q.kcal.p?Math.round(q.kcal.p/4):0} g</small></div>

  function v36BindPersonal(){

    function calcBmrFromForm(){

    const tdee=p.tdee||0;
    const completeDays=[];

      if(dt===b)break;
    }
    const monthDiff=monthlyCalorieDifference(new Date(a+'T00:00:00').getFullYear(),new Date(a+'T00:00:00').getMonth());
    return {
      period:{start:a,end:b},
      profile:{
        name:p.p?.name||'',

        height:p.height||'',

<script>

(function(){

    h+='<div class="analysis-kpis"><div class="analysis-kpi"><span>トレーニング回数</span><b>'+sessions+'回</b></div><div class="analysis-kpi"><span>セット数</span><b>'+sets+'</b></div><div class="analysis-kpi"><span>総負荷量</span><b>'+Math.round(vol).toLocaleString()+' kg</b></div></div>';
    h+='<div class="card"><h3 style="margin:4px 0 10px">部位別・回数／負荷量</h3><table class="table"><tr><th>部位</th><th>回数</th></tr>'+Object.keys(byPart).map(k=>'<tr><td>'+esc(k)+'</td><td>'+byPart[k]+'回</td></tr>').join('')+'</table></div>';
    h+='<div class="card"><h3 style="margin:4px 0 10px">記録期間の最大重量推移</h3><div style="overflow-x:auto"><table class="table"><tr><th>日</th><th>最大重量</th></tr>'+Object.keys(maxByDate).sort().map(d=>'<tr><td>'+d+'</td><td>'+maxByDate[d]+' kg</td></tr>').join('')+'</table></div></div></div>';
    document.getElementById('analysis').innerHTML=h;bindTabs();document.getElementById('v74WorkoutApply').onclick=()=>{period=document.getElementById('v74WorkoutPeriod').value||'all';renderWorkout()};
  }
  function renderBody(){
    if(typeof window.renderMorphBodyV61==='function'){
      window.renderMorphBodyV61();
      const el=document.getElementById('analysis');if(!el)return;
      const old=el.querySelector('.analysis-v10-tabs');if(old)old.outerHTML=tabs();bindTabs();return;
    }
    renderSimpleBody();
  }
  function renderSimpleBody(){
    const el=document.getElementById('analysis');const ps=typeof photoRecords==='function'?photoRecords(uid()):[];el.innerHTML='<div class="card"><h2>分析</h2>'+tabs()+'<div class="analysis-v10-card"><h3>身体写真</h3><div class="note">写真 '+ps.length+'枚</div></div></div>';bindTabs();
  }
  function renderSummary(){
    const store=typeof window.v74GetAiAdviceStore==='function'?window.v74GetAiAdviceStore():{current:null,history:[]};
    const current=store.current;
    const history=Array.isArray(store.history)?store.history:[];
    let h='<div class="card"><h2>分析</h2>'+tabs();
    h+='<div class="analysis-v10-card"><h3>🤖 総評・AIアドバイス</h3><div class="note">筋トレ記録・食事記録・個人データ（年齢、身長、体重、活動量、目標、基礎代謝量など）をまとめてGeminiが分析します。新しいアドバイスを更新するまで、現在のアドバイスを表示します。</div><button type="button" id="v74RunAi" style="margin-top:10px">🤖 AIアドバイスを更新</button><div class="note" style="margin-top:8px">Gemini APIキーは「メニュー → AI設定」から設定してください。</div></div>';
    h+='<div class="analysis-v10-card"><h3>現在のAIアドバイス</h3><div id="v74AiOutput" class="ai-advice">'+(current?.text?esc(current.text).replace(/\n/g,'<br>'):'まだAIアドバイスは生成されていません。')+'</div>'+(current?.generatedAt?'<div class="note" style="margin-top:8px">生成日時：'+esc(new Date(current.generatedAt).toLocaleString('ja-JP'))+'</div>':'')+'</div>';
    h+='<div class="analysis-v10-card"><h3>AIアドバイス履歴</h3>'+(history.length?history.map((item,i)=>'<details '+(i===0?'open':'')+'><summary>'+esc(item.generatedAt?new Date(item.generatedAt).toLocaleString('ja-JP'):'日時不明')+'</summary><div class="ai-advice" style="margin-top:8px">'+esc(item.text||'').replace(/\n/g,'<br>')+'</div></details>').join(''):'<div class="note">過去のアドバイスはまだありません。</div>')+'</div></div>';
    document.getElementById('analysis').innerHTML=h;bindTabs();
    document.getElementById('v74RunAi').onclick=async()=>{const out=document.getElementById('v74AiOutput');if(out)out.textContent='AIが筋トレ・食事・個人データを分析中…';try{if(typeof window.v74GenerateAiAdvice!=='function')throw new Error('AIアドバイス機能を読み込めませんでした');await window.v74GenerateAiAdvice();setTimeout(renderSummary,80)}catch(e){if(out)out.textContent='AIアドバイスの取得に失敗しました。\n\n'+(e?.message||'通信エラーです。')}};
  }
  function bindTabs(){document.querySelectorAll('[data-v74tab]').forEach(b=>b.onclick=()=>{setTab(b.dataset.v74tab);render()})}
  function render(){if(tab==='meal')renderMeal();else if(tab==='body')renderBody();else if(tab==='summary')renderSummary();else renderWorkout()}
  window.__v74RenderAnalysis=render;
  window.renderAnalysis=render;
  document.addEventListener('click',e=>{const n=e.target.closest?.('.nav[data-tab="analysis"]');if(n){setTimeout(render,100)}} ,true);
  document.addEventListener('click',e=>{const b=e.target.closest?.('[data-afix],[data-clean-tab],[data-final-meal-tab],[data-mf],[data-s]');if(!b)return;const t=b.dataset.afix||b.dataset.cleanTab||b.dataset.finalMealTab||b.dataset.mf||b.dataset.s;if(!t)return;e.preventDefault();e.stopImmediatePropagation();setTab(t);render()},true);
  // メニューの公開設定に閲覧ボタンを追加
  const oldSettings=window.renderSettings;
  window.renderSettings=function(){oldSettings?.apply(this,arguments);const card=[...document.querySelectorAll('#settings .card')].find(x=>x.textContent.includes('他ユーザーへの公開設定'));if(!card)return;if(document.getElementById('v74ViewUsers'))return;const b=document.createElement('button');b.id='v74ViewUsers';b.type='button';b.textContent='👀 他ユーザーの記録を閲覧';b.style.cssText='margin-top:10px;width:100%;padding:11px;border:0;border-radius:9px;background:#222;color:#fff;font-weight:700';b.onclick=showUsers;card.appendChild(b)};
  function showUsers(){
    const list=Object.entries(profiles||{}).filter(([id,p])=>id!==currentUserId&&p&&p.visibility&&(p.visibility.workout||p.visibility.food||p.visibility.photo));
    let h='<div class="modal-overlay" id="v74UserModal"><div class="modal" style="max-width:520px"><div class="row" style="justify-content:space-between"><h3>他ユーザーの記録を閲覧</h3><button type="button" id="v74Close">✕</button></div>';
    if(!list.length)h+='<div class="note">現在、閲覧できる公開ユーザーはいません。</div>';else h+=list.map(([id,p])=>'<div style="padding:10px 0;border-bottom:1px solid #eee"><b>'+esc(p.name||'利用者')+'</b><div class="note">'+[(p.visibility.workout?'トレ履歴':''),(p.visibility.food?'食事':''),(p.visibility.photo?'写真':'')].filter(Boolean).join('・')+'</div><button type="button" data-v74user="'+esc(id)+'" style="margin-top:7px">閲覧</button></div>').join('');
    h+='</div></div>';document.body.insertAdjacentHTML('beforeend',h);document.getElementById('v74Close').onclick=()=>document.getElementById('v74UserModal')?.remove();document.querySelectorAll('[data-v74user]').forEach(b=>b.onclick=()=>{window.__analysisViewUserId=b.dataset.v74user;viewer=b.dataset.v74user;document.getElementById('v74UserModal')?.remove();state.tab='analysis';setTab('workout');render()})
  }
  window.addEventListener('load',()=>setTimeout(()=>{if(state?.tab==='analysis')render()},150));
})();
</script>

</body>
</html>
