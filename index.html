<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>筋トレ記録</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f5f7;color:#222}
header{position:sticky;top:0;z-index:10;background:#fff;padding:14px 16px;font-size:20px;font-weight:700;border-bottom:1px solid #ddd}
main{padding:14px 14px 90px;max-width:900px;margin:auto}.screen{display:none}.screen.active{display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #00000012}
h2{font-size:18px;margin:4px 0 12px}.muted{color:#777;font-size:13px}.small{font-size:12px}
button,select,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:9px 12px;background:#222;color:#fff;cursor:pointer}
button.sub{background:#eee;color:#222}button.danger{background:#d33}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:9px;background:#fff}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid #ddd;display:flex;padding:7px 4px env(safe-area-inset-bottom)}
.nav{flex:1;text-align:center;background:none;color:#777;padding:7px 2px;font-size:11px}.nav.active{color:#111;font-weight:700}
.nav span{display:block;font-size:20px;margin-bottom:2px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:11px;color:#888;padding:4px}
.day{min-height:54px;background:#e9e9ed;color:#222;border-radius:9px;padding:5px;text-align:left;font-size:12px;position:relative}.day.selected{background:#fff;outline:3px solid #222}.dow{color:#555;font-weight:600}.marks{margin-top:5px;font-size:13px;line-height:1.2}
.day.other{opacity:.35}.day.selected{outline:2px solid #222}.daynum{font-weight:600}.marks{margin-top:5px;font-size:12px;line-height:1.15}
.preview-scroll{max-height:55vh;overflow-y:auto}.workout{border:1px solid #ddd;border-radius:11px;padding:11px;margin:8px 0}
.workout-title{font-weight:700}.workout-meta{font-size:12px;color:#666;margin-top:3px}
.sets{margin-top:7px}.set{display:flex;gap:8px;font-size:13px;padding:4px 0;white-space:nowrap}
.memo{background:#fff8d9;border-radius:9px;padding:9px;margin-top:8px;white-space:pre-wrap}
.section-title{font-weight:700;margin:16px 0 7px}.exercise-list{display:flex;flex-direction:column;gap:6px}
.exercise-item{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:9px;padding:9px}
.modal-bg{display:none;position:fixed;inset:0;background:#0007;z-index:50;padding:20px;overflow:auto}.modal-bg.show{display:block}
.modal{background:#fff;border-radius:15px;max-width:650px;margin:30px auto;padding:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#eee;color:#222}
.set-input{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:end;margin:6px 0}
.analysis-controls{display:grid;gap:8px}.user-checks{display:flex;gap:7px;flex-wrap:wrap}.user-check{border:1px solid #ccc;border-radius:20px;padding:7px 10px;font-size:13px}
.user-check input{width:auto;margin-right:4px}.chart-wrap{height:290px}.chart-wrap canvas{width:100%;height:290px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:8px 0}.legend-item{display:flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f7f7f7;border-radius:10px;padding:10px}.stat b{font-size:18px;display:block}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid #eee;padding:7px;text-align:left}
.empty{text-align:center;color:#888;padding:20px}.note{font-size:12px;color:#666;line-height:1.5}
</style>
<style>
.day{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-start!important;text-align:center!important}
.day.sat{background:#eef6ff!important}
.day.sun,.day.holiday{background:#fff0f0!important}
.day.selected{background:#fff!important;outline:3px solid #222}
.marks{width:100%;text-align:center!important}
</style>
<style>
.day.sat{background:#eaf4ff!important;}
.day.sun,.day.holiday{background:#fff0f0!important;}
.day.sat .date,.day.sat .daynum,.day.sat .num{color:#4d82b5!important;}
.day.sun .date,.day.sun .daynum,.day.sun .num,
.day.holiday .date,.day.holiday .daynum,.day.holiday .num{color:#c65c5c!important;}
</style>

<style>
#loginOverlay{position:fixed;inset:0;z-index:100;background:#f5f5f7;display:flex;align-items:center;justify-content:center;padding:24px}
#loginCard{background:#fff;border-radius:18px;padding:26px 20px;max-width:420px;width:100%;box-shadow:0 4px 20px #0002;text-align:center}
#loginCard h2{margin:0 0 10px}
#loginCard p{color:#666;font-size:13px;line-height:1.6}
#loginBtn{width:100%;margin-top:14px;background:#222}
#loginUser{font-size:12px;color:#666}
.firebase-badge{font-size:11px;color:#777;margin-top:10px}
</style>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loginOverlay">
  <div id="loginCard">
    <h2>筋トレ記録</h2>
    <p>複数人で記録を共有するには<br>Googleアカウントでログインしてください。</p>
    <button id="loginBtn" onclick="loginWithGoogle()">Googleでログイン</button>
    <div id="loginStatus" class="firebase-badge"></div>
  </div>
</div>

<header>筋トレ記録</header>
<main>
<section id="calendar" class="screen active"></section>
<section id="menu" class="screen"></section>
<section id="analysis" class="screen"></section>
<section id="settings" class="screen"></section>
</main>
<nav class="bottom">
<button class="nav active" data-tab="calendar"><span>🏠</span>ホーム</button>
<button class="nav" data-tab="menu"><span>📋</span>種目</button>
<button class="nav" data-tab="analysis"><span>📊</span>分析</button>
<button class="nav" data-tab="settings"><span>⚙️</span>メニュー</button>
</nav>
<div id="modalBg" class="modal-bg" onclick="modalBackground(event)"><div id="modal" class="modal"></div></div>

<script>
const KEY='kintoreData',MENUKEY='kintoreMenus',PLANKEY='kintorePlans',PROFILEKEY='kintoreProfile',TEMPLATEKEY='kintoreTemplates';
const FIREBASE_APP_ID='shared';
let firebaseReady=false, firebaseLoading=false, firebaseSaving=false, firebaseSaveQueued=false, firebaseUnsub=null;
const PROFILESKEY='kintoreProfiles',CURRENTUSERKEY='kintoreCurrentUser';

const categories=['胸','背中','肩','腕','脚','腹','有酸素','その他'];
const cardioExercises=['ランニング','ジョギング','ウォーキング','サイクリング','水泳','その他'];
const defaultMenus={
胸:['ベンチプレス','チェストプレス','ダンベルプレス','ディップス'],
背中:['懸垂','ラットプルダウン','ローイング','ワンハンドロー'],
肩:['ショルダープレス','サイドレイズ','フロントレイズ'],
腕:['アームカール','ハンマーカール','トライセプスプレスダウン'],
脚:['スクワット','スミスマシンスクワット','レッグプレス','レッグカール','カーフレイズ'],
腹:['アブドミナル','レッグレイズ','ケーブルクランチ'],
有酸素:cardioExercises.slice(),
その他:['その他']
};
function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}
function isoToday(){let d=new Date();return localDate(d)}
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function formatDate(s){let d=new Date(s+'T00:00:00');return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
let data=loadJSON(KEY,{});
let menus=loadJSON(MENUKEY,defaultMenus);
let plans=loadJSON(PLANKEY,{});
let templates=loadJSON(TEMPLATEKEY,{});
let profiles=loadJSON(PROFILESKEY,null);
let legacyProfile=loadJSON(PROFILEKEY,{name:'自分',height:'',weight:''});

if(!profiles||!Object.keys(profiles).length){
  profiles={user1:{id:'user1',name:legacyProfile.name||'自分',height:legacyProfile.height||'',weight:legacyProfile.weight||''}};
}
let currentUserId=localStorage.getItem(CURRENTUSERKEY)||Object.keys(profiles)[0];
if(!profiles[currentUserId])currentUserId=Object.keys(profiles)[0];
let profile=profiles[currentUserId];

function mergeDefaultMenus(){
  categories.forEach(c=>{
    if(!Array.isArray(menus[c]))menus[c]=[];
    defaultMenus[c].forEach(x=>{if(!menus[c].includes(x))menus[c].push(x)});
  });
  saveJSON(MENUKEY,menus);
}
mergeDefaultMenus();

function migrateUserData(){
  Object.keys(data).forEach(date=>{
    let r=data[date]; if(!r||typeof r!=='object')return;
    if(!Array.isArray(r.workouts))r.workouts=[];
    r.workouts.forEach(w=>{if(!w.userId)w.userId=currentUserId});
    if(!r.memos){
      r.memos={};
      if(r.memo)r.memos[currentUserId]=r.memo;
    }
  });
  saveJSON(KEY,data);saveJSON(PROFILESKEY,profiles);localStorage.setItem(CURRENTUSERKEY,currentUserId);
}
migrateUserData();

let state={tab:'calendar',date:isoToday(),month:new Date(),modalWorkout:null,modalEditIndex:null};
let analysisState={unit:'month',span:12,metric:'weight',exerciseKey:'',users:[currentUserId]};

function saveAll(){
  saveJSON(KEY,data);saveJSON(MENUKEY,menus);saveJSON(PLANKEY,plans);saveJSON(TEMPLATEKEY,templates);
  saveJSON(PROFILESKEY,profiles);saveJSON(PROFILEKEY,profiles[currentUserId]);
  localStorage.setItem(CURRENTUSERKEY,currentUserId);
  if(firebaseReady && !firebaseLoading) firebaseQueueSave();
}

function workoutUser(w){return w.userId||currentUserId}
function getRecord(date){
  let r=data[date]||{workouts:[],memo:''};
  let workouts=(r.workouts||[]).filter(w=>workoutUser(w)===currentUserId);
  let memo=r.memos&&Object.prototype.hasOwnProperty.call(r.memos,currentUserId)?r.memos[currentUserId]:(r.memos? '':(r.memo||''));
  return {workouts,memo};
}
function hasWorkout(date){return getRecord(date).workouts.length>0}
function hasMemo(date){return !!getRecord(date).memo}
function hasPlan(date){return !!plans[date]}
function showTab(t){state.tab=t;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>showTab(x.dataset.tab));

function render(){if(state.tab==='calendar')renderHome();if(state.tab==='menu')renderMenu();if(state.tab==='analysis')renderAnalysis();if(state.tab==='settings')renderSettings()}

function renderHome(){
  let el=document.getElementById('calendar');
  el.innerHTML=`<div class="card">${renderCalendar()}</div><div id="dayPreview"></div>`;
  renderHomePreview();
}
function renderCalendar(){
  let y=state.month.getFullYear(),m=state.month.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
  let html=`<div class="calendar-head"><button class="sub" onclick="moveMonth(-1)">‹</button><b>${y}年${m+1}月</b><button class="sub" onclick="moveMonth(1)">›</button></div><div class="calendar">`;
  ['日','月','火','水','木','金','土'].forEach(x=>html+=`<div class="dow">${x}</div>`);
  for(let i=0;i<first.getDay();i++)html+=`<div></div>`;
  for(let d=1;d<=last.getDate();d++){
    let ds=localDate(new Date(y,m,d)),cls=ds===state.date?' selected':'';
    let marks=(hasWorkout(ds)?'🔥':'')+(hasPlan(ds)?' 📅':'')+(hasMemo(ds)?' 📝':'');
    html+=`<button class="day${cls}" onclick="openDate('${ds}')"><div class="daynum">${d}</div><div class="marks">${marks}</div></button>`;
  }
  html+='</div><div class="note" style="margin-top:8px">🔥記録　📅予定　📝メモ</div>';return html;
}
function openDate(d){state.date=d;render()}
function moveMonth(n){state.month.setMonth(state.month.getMonth()+n);render()}

function renderHomePreview(){
  let r=getRecord(state.date),el=document.getElementById('dayPreview');
  let html=`<div class="card"><h2>${formatDate(state.date)}</h2><div class="preview-scroll">`;
  if(r.workouts.length)r.workouts.forEach((w,i)=>html+=homeWorkoutHTML(w,i));
  else if(!hasPlan(state.date))html+=`<div class="empty">この日の記録はありません</div>`;
  if(r.memo)html+=`<div class="section-title">その日のメモ</div><div class="memo">${esc(r.memo)}</div>`;
  html+=`</div><div class="row" style="margin-top:10px"><button onclick="addWorkout()">＋記録</button><button class="sub" onclick="openDayMemoModal()">📝 ${r.memo?'メモ編集':'メモ追加'}</button></div></div>`;
  el.innerHTML=html;
}
function homeWorkoutHTML(w,i){
  let h=`<div class="workout"><div class="row" style="justify-content:space-between"><div><div class="workout-title">${esc(w.exercise)}</div><div class="workout-meta">${esc(w.cat)}${w.equip?' ・ '+esc(w.equip):''}${w.time?' ・ '+esc(w.time):''}</div></div><button class="sub" onclick="openWorkoutModal(${i})">✏️ 編集</button></div>`;
  if(w.sets?.length){h+='<div class="sets">';w.sets.forEach((s,j)=>h+=`<div class="set">Set ${j+1}　${s.weight?esc(s.weight)+' kg':'-'} × ${s.reps?esc(s.reps)+' 回':'-'}</div>`);h+='</div>'}
  if(w.memo)h+=`<div class="memo">${esc(w.memo)}</div>`;h+='</div>';return h;
}

function addWorkout(){state.modalEditIndex=null;state.modalWorkout={cat:'',exercise:'',equip:'',sets:[{weight:'',reps:''},{weight:'',reps:''},{weight:'',reps:''}],time:'',memo:''};openModal();renderWorkoutModal()}
function openWorkoutModal(i){let r=getRecord(state.date);state.modalEditIndex=i;state.modalWorkout=JSON.parse(JSON.stringify(r.workouts[i]));openModal();renderWorkoutModal()}
function openModal(){document.getElementById('modalBg').classList.add('show')}
function closeModal(){document.getElementById('modalBg').classList.remove('show')}
function modalBackground(e){if(e.target.id==='modalBg')closeModal()}

function renderWorkoutModal(){
 let w=state.modalWorkout;
 let opts=categories.map(c=>`<option ${w.cat===c?'selected':''}>${c}</option>`).join('');
 let ex=(menus[w.cat]||[]).map(x=>`<option ${w.exercise===x?'selected':''}>${esc(x)}</option>`).join('');
 let h=`<div class="modal-head"><h2>${state.modalEditIndex==null?'トレーニング記録':'記録を編集'}</h2><button class="close" onclick="closeModal()">✕</button></div>`;
 h+=`<label>部位</label><select id="mcat" onchange="modalCategoryChanged()"><option value="">選択</option>${opts}</select>`;
 h+=`<label>種目</label><select id="mex"><option value="">選択</option>${ex}</select>`;
 h+=`<label>器具・メモ用名称</label><input id="mequip" value="${esc(w.equip)}" placeholder="任意">`;
 if(w.cat==='有酸素')h+=`<label>時間</label><input id="mtime" value="${esc(w.time)}" placeholder="例：30分">`;
 else{
   h+=`<div class="section-title">セット</div><div id="sets">`;
   (w.sets||[]).forEach((s,i)=>h+=`<div class="set-input"><div><label>重量</label><input class="sw" value="${esc(s.weight)}" inputmode="decimal"></div><div><label>回数</label><input class="sr" value="${esc(s.reps)}" inputmode="numeric"></div><button class="danger" onclick="modalRemoveSet(${i})">削除</button></div>`);
   h+=`</div><button class="sub" onclick="modalAddSet()">＋セット追加</button>`;
 }
 h+=`<label>種目メモ</label><textarea id="mmemo" rows="3">${esc(w.memo)}</textarea><div class="row" style="margin-top:12px"><button onclick="saveWorkoutModal()">保存</button>${state.modalEditIndex!=null?'<button class="danger" onclick="deleteWorkoutFromModal()">削除</button>':''}<button class="sub" onclick="closeModal()">キャンセル</button></div>`;
 document.getElementById('modal').innerHTML=h;
 document.getElementById('mex').value=w.exercise||'';
}
function modalCategoryChanged(){syncWorkoutModal();state.modalWorkout.cat=document.getElementById('mcat').value;state.modalWorkout.exercise='';renderWorkoutModal()}
function syncWorkoutModal(){
 let w=state.modalWorkout;w.cat=document.getElementById('mcat').value;w.exercise=document.getElementById('mex').value;w.equip=document.getElementById('mequip').value;
 if(document.getElementById('mtime'))w.time=document.getElementById('mtime').value;
 w.memo=document.getElementById('mmemo').value;
 if(w.cat!=='有酸素'){w.sets=[...document.querySelectorAll('#sets .set-input')].map(x=>({weight:x.querySelector('.sw').value,reps:x.querySelector('.sr').value}))}
}
function modalAddSet(){syncWorkoutModal();state.modalWorkout.sets.push({weight:'',reps:''});renderWorkoutModal()}
function modalRemoveSet(i){syncWorkoutModal();if(state.modalWorkout.sets.length>1)state.modalWorkout.sets.splice(i,1);renderWorkoutModal()}
function saveWorkoutModal(){
 syncWorkoutModal();let w=state.modalWorkout;
 if(!w.cat||!w.exercise){alert('部位と種目を選択してください');return}
 w.userId=currentUserId;
 if(!data[state.date])data[state.date]={workouts:[],memo:'',memos:{}};
 if(!data[state.date].memos)data[state.date].memos={};
 let all=data[state.date].workouts||[];
 let idx=-1,count=0;
 if(state.modalEditIndex!=null){for(let i=0;i<all.length;i++)if(workoutUser(all[i])===currentUserId){if(count===state.modalEditIndex){idx=i;break}count++}}
 if(idx>=0)all[idx]=w;else all.push(w);
 data[state.date].workouts=all;saveAll();closeModal();render();
}
function deleteWorkoutFromModal(){
 if(!confirm('この記録を削除しますか？'))return;
 let all=data[state.date]?.workouts||[],count=0,idx=-1;
 for(let i=0;i<all.length;i++)if(workoutUser(all[i])===currentUserId){if(count===state.modalEditIndex){idx=i;break}count++}
 if(idx>=0)all.splice(idx,1);data[state.date].workouts=all;saveAll();closeModal();render();
}
function openDayMemoModal(){
 let r=getRecord(state.date);
 document.getElementById('modal').innerHTML=`<div class="modal-head"><h2>その日のメモ</h2><button class="close" onclick="closeModal()">✕</button></div><textarea id="daymemo" rows="8" placeholder="この日のメモ">${esc(r.memo)}</textarea><div class="row" style="margin-top:12px"><button onclick="saveDayMemo()">保存</button><button class="sub" onclick="closeModal()">キャンセル</button></div>`;
 openModal();
}
function saveDayMemo(){
 let memo=document.getElementById('daymemo').value;
 if(!data[state.date])data[state.date]={workouts:[],memo:'',memos:{}};
 if(!data[state.date].memos)data[state.date].memos={};
 data[state.date].memos[currentUserId]=memo;
 saveAll();closeModal();render();
}

function renderMenu(){
 let el=document.getElementById('menu'),h=`<div class="card"><h2>種目</h2><div class="note">ここで登録した種目は記録入力時の候補に表示されます。</div>`;
 categories.forEach(c=>{h+=`<div class="section-title">${c}</div><div class="exercise-list">`;
 (menus[c]||[]).forEach((x,i)=>h+=`<div class="exercise-item"><span>${esc(x)}</span><button class="danger" onclick="deleteMenuExercise('${c}',${i})">削除</button></div>`);
 h+=`</div><div class="row" style="margin-top:6px"><input id="new_${c}" placeholder="${c}の種目を追加"><button onclick="addMenuExercise('${c}')">追加</button></div>`});
 h+='</div>';el.innerHTML=h;
}
function addMenuExercise(c){let x=document.getElementById('new_'+c).value.trim();if(!x)return;if(!menus[c])menus[c]=[];if(!menus[c].includes(x))menus[c].push(x);saveAll();renderMenu()}
function deleteMenuExercise(c,i){if(!confirm('削除しますか？'))return;menus[c].splice(i,1);saveAll();renderMenu()}


function firebaseAccountHTML(){
  const u=fbAuth&&fbAuth.currentUser;
  if(!u)return '';
  return `<div class="card"><h2>クラウド共有</h2><div class="note">Googleログイン中：${esc(u.displayName||u.email||'')}</div><div class="row" style="margin-top:8px"><button class="sub" onclick="logoutFirebase()">ログアウト</button></div></div>`;
}
function renderSettings(){
 let el=document.getElementById('settings');
 let userOpts=Object.keys(profiles).map(id=>`<option value="${id}" ${id===currentUserId?'selected':''}>${esc(profiles[id].name||id)}</option>`).join('');
 el.innerHTML=`<div class="card"><h2>個人データ</h2>
 <label>利用者</label><select id="userSelect" onchange="changeCurrentUser(this.value)">${userOpts}</select>
 <div class="row" style="margin-top:8px"><button class="sub" onclick="addUserProfile()">＋利用者追加</button></div>
 <label>名前</label><input id="pname" value="${esc(profile.name)}">
 <label>身長（cm）</label><input id="pheight" value="${esc(profile.height)}" inputmode="decimal">
 <label>体重（kg）</label><input id="pweight" value="${esc(profile.weight)}" inputmode="decimal">
 <div class="note" style="margin-top:7px">体重は日々の記録ではなく、個人データとして登録します。分析の「体重比」に使用します。</div>
 <button style="margin-top:10px" onclick="saveProfile()">個人データを保存</button></div>
 <div class="card"><h2>マーク</h2><div>🔥 トレーニング記録</div><div>📅 トレーニング予定</div><div>📝 その日のメモ</div></div>

function getExerciseOptions(){
 let map=new Map();
 categories.filter(c=>c!=='有酸素').forEach(c=>(menus[c]||[]).forEach(ex=>map.set(c+'|||'+ex,{key:c+'|||'+ex,cat:c,exercise:ex})));
 Object.values(data).forEach(r=>(r.workouts||[]).forEach(w=>{if(w.cat!=='有酸素')map.set(w.cat+'|||'+w.exercise,{key:w.cat+'|||'+w.exercise,cat:w.cat,exercise:w.exercise})}));
 return [...map.values()].sort((a,b)=>categories.indexOf(a.cat)-categories.indexOf(b.cat)||a.exercise.localeCompare(b.exercise,'ja'));
}
function selectedAnalysisUsers(){
 let ids=analysisState.users.filter(id=>profiles[id]);
 if(!ids.length)ids=[currentUserId];
 return ids;
}
function periodList(unit,span){
 let now=new Date(),arr=[];
 if(unit==='month'){let base=new Date(now.getFullYear(),now.getMonth(),1);for(let i=span-1;i>=0;i--){let d=new Date(base);d.setMonth(base.getMonth()-i);arr.push(localDate(d).slice(0,7))}}
 else{for(let y=now.getFullYear()-span+1;y<=now.getFullYear();y++)arr.push(String(y))}
 return arr;
}
function periodRange(key,unit){
 if(unit==='year')return [key+'-01-01',key+'-12-31'];
 let [y,m]=key.split('-').map(Number),a=new Date(y,m-1,1),b=new Date(y,m,0);
 return [localDate(a),localDate(b)];
}
function periodLabel(k,u){return u==='year'?k:k.replace('-','/')}
function workoutInRange(w,date,a,b,userId){return workoutUser(w)===userId&&date>=a&&date<=b}
function maxWeight(userId,cat,exercise,a,b){
 let max=null;
 Object.keys(data).forEach(date=>{if(date<a||date>b)return;(data[date].workouts||[]).forEach(w=>{if(workoutInRange(w,date,a,b,userId)&&w.cat===cat&&w.exercise===exercise)(w.sets||[]).forEach(s=>{let n=parseFloat(s.weight);if(Number.isFinite(n)&&n>=(max??-Infinity))max=n})})});
 return max;
}
function volume(userId,a,b,exerciseKey=''){
 let total=0,sets=0;
 Object.keys(data).forEach(date=>{if(date<a||date>b)return;(data[date].workouts||[]).forEach(w=>{if(workoutUser(w)!==userId||w.cat==='有酸素'||(exerciseKey&&w.cat+'|||'+w.exercise!==exerciseKey))return;(w.sets||[]).forEach(s=>{let wt=parseFloat(s.weight),rp=parseFloat(s.reps);if(Number.isFinite(wt)&&Number.isFinite(rp)){total+=wt*rp;sets++}})})});
 return {total,sets};
}
function trainingDays(userId,a,b){let n=0;Object.keys(data).forEach(date=>{if(date<a||date>b)return;if((data[date].workouts||[]).some(w=>workoutUser(w)===userId))n++});return n}
function plannedAchievement(userId,a,b){
 let p=0,done=0;Object.keys(plans).forEach(date=>{if(date<a||date>b)return;if(plans[date]){p++;if(trainingDays(userId,date,date)>0)done++}});return p?Math.round(done/p*100):null;
}
function bodyPartCounts(userId,a,b){
 let o={};categories.forEach(c=>o[c]=0);
 Object.keys(data).forEach(date=>{if(date<a||date>b)return;(data[date].workouts||[]).forEach(w=>{if(workoutUser(w)===userId)o[w.cat]=(o[w.cat]||0)+1})});return o;
}
function personalBest(userId,cat,exercise){
 let best=null,date='';
 Object.keys(data).forEach(d=>{(data[d].workouts||[]).forEach(w=>{if(workoutUser(w)===userId&&w.cat===cat&&w.exercise===exercise)(w.sets||[]).forEach(s=>{let n=parseFloat(s.weight);if(Number.isFinite(n)&&(!best||n>best)){best=n;date=d}})})});
 return {best,date};
}
function currentMonthRange(){let d=new Date(),a=new Date(d.getFullYear(),d.getMonth(),1),b=new Date(d.getFullYear(),d.getMonth()+1,0);return [localDate(a),localDate(b)]}

function renderAnalysis(){
 let el=document.getElementById('analysis'),users=selectedAnalysisUsers(),opts=getExerciseOptions();
 if(!analysisState.exerciseKey||!opts.some(x=>x.key===analysisState.exerciseKey))analysisState.exerciseKey=opts[0]?.key||'';
 let ex=opts.find(x=>x.key===analysisState.exerciseKey)||null;
 let spanOptions=analysisState.unit==='month'?[6,12,24,36]:[3,5,10];
 if(!spanOptions.includes(Number(analysisState.span)))analysisState.span=analysisState.unit==='month'?12:5;
 let userChecks=Object.keys(profiles).map((id,i)=>`<label class="user-check"><input type="checkbox" class="au" value="${id}" ${users.includes(id)?'checked':''} onchange="analysisUserChanged()"> ${esc(profiles[id].name||id)}</label>`).join('');
 let exerciseOptions=opts.map(x=>`<option value="${x.key}" ${x.key===analysisState.exerciseKey?'selected':''}>${esc(x.cat)}：${esc(x.exercise)}</option>`).join('');
 let spanOpts=spanOptions.map(x=>`<option value="${x}" ${x===Number(analysisState.span)?'selected':''}>${x}${analysisState.unit==='month'?'ヶ月':'年'}</option>`).join('');
 let [ma,mb]=currentMonthRange(),su=users[0],sv=su?getUserSummary(su,ma,mb):null;
 let html=`<div class="card"><h2>分析</h2>
 <div class="analysis-controls"><div><label>表示する利用者</label><div class="user-checks">${userChecks}</div></div>
 <div><label>種目</label><select id="aex" onchange="analysisChanged()">${exerciseOptions}</select></div>
 <div class="row"><div style="flex:1"><label>集計単位</label><select id="aunit" onchange="analysisChanged()"><option value="month" ${analysisState.unit==='month'?'selected':''}>月単位</option><option value="year" ${analysisState.unit==='year'?'selected':''}>年単位</option></select></div>
 <div style="flex:1"><label>期間</label><select id="aspan" onchange="analysisChanged()">${spanOpts}</select></div>
 <div style="flex:1"><label>表示</label><select id="ametric" onchange="analysisChanged()"><option value="weight" ${analysisState.metric==='weight'?'selected':''}>最大重量</option><option value="ratio" ${analysisState.metric==='ratio'?'selected':''}>体重比</option></select></div></div></div></div>`;
 html+=`<div class="card"><h2>${ex?esc(ex.exercise):'最大重量'}の推移</h2><div id="legend" class="legend"></div><div class="chart-wrap"><canvas id="maxChart"></canvas></div><div class="note">複数の利用者を選択すると同じグラフ上に表示します。体重比＝最大重量÷個人データの体重。</div></div>`;
 if(su&&sv){
   html+=`<div class="card"><h2>${esc(profiles[su].name)}の今月</h2><div class="stats"><div class="stat">トレーニング日数<b>${sv.days}日</b></div><div class="stat">セット数<b>${sv.sets}</b></div><div class="stat">総負荷量<b>${Math.round(sv.volume).toLocaleString()} kg</b></div><div class="stat">予定達成率<b>${sv.achievement==null?'—':sv.achievement+'%'}</b></div></div></div>`;
 }
 if(ex){
   html+=`<div class="card"><h2>自己ベスト</h2><table class="table"><tr><th>利用者</th><th>最大重量</th><th>体重比</th><th>記録日</th></tr>`;
   users.forEach(id=>{let b=personalBest(id,ex.cat,ex.exercise),wt=parseFloat(profiles[id].weight),ratio=b.best&&wt>0?(b.best/wt).toFixed(2)+'×':'—';html+=`<tr><td>${esc(profiles[id].name)}</td><td>${b.best==null?'—':b.best+' kg'}</td><td>${ratio}</td><td>${b.date||'—'}</td></tr>`});
   html+='</table></div>';
 }
 if(su){
   let counts=bodyPartCounts(su,ma,mb);html+=`<div class="card"><h2>部位別トレーニング回数（今月）</h2><table class="table">`;
   categories.forEach(c=>html+=`<tr><td>${c}</td><td>${counts[c]||0}回</td></tr>`);html+='</table></div>';
 }
 el.innerHTML=html;drawMaxChart();
}
function getUserSummary(id,a,b){let v=volume(id,a,b),ach=plannedAchievement(id,a,b);return{days:trainingDays(id,a,b),sets:v.sets,volume:v.total,achievement:ach}}
function analysisChanged(){

function drawMaxChart(){
 let canvas=document.getElementById('maxChart');if(!canvas)return;
 let ex=getExerciseOptions().find(x=>x.key===analysisState.exerciseKey);if(!ex)return;
 let periods=periodList(analysisState.unit,Number(analysisState.span)),users=selectedAnalysisUsers();
 let rect=canvas.getBoundingClientRect(),w=Math.max(320,rect.width),h=290,dpr=window.devicePixelRatio||1;
 canvas.width=w*dpr;canvas.height=h*dpr;let ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.clearRect(0,0,w,h);
 const palette=['#222','#4c78a8','#f58518','#54a24b','#b279a2','#e45756','#72b7b2','#ff9da6'];
 let series=users.map((id,ui)=>({id,values:periods.map(p=>{let [a,b]=periodRange(p,analysisState.unit),m=maxWeight(id,ex.cat,ex.exercise,a,b);if(m==null)return null;if(analysisState.metric==='ratio'){let wt=parseFloat(profiles[id].weight);return wt>0?m/wt:null}return m})}));
 let vals=series.flatMap(s=>s.values).filter(v=>v!=null);
 let legend=document.getElementById('legend');legend.innerHTML=users.map((id,i)=>`<span class="legend-item"><i class="dot" style="background:${palette[i%palette.length]}"></i>${esc(profiles[id].name)}</span>`).join('');
 if(!vals.length){ctx.fillStyle='#777';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('この条件の記録がありません',w/2,h/2);return}
 let max=Math.max(...vals);max=max<=0?1:max*1.15;let left=52,right=14,top=24,bottom=42,pw=w-left-right,ph=h-top-bottom;
 ctx.strokeStyle='#ddd';ctx.fillStyle='#666';ctx.font='11px sans-serif';ctx.textAlign='right';
 for(let i=0;i<=4;i++){let y=top+ph*i/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();let v=max*(1-i/4);ctx.fillText(analysisState.metric==='ratio'?v.toFixed(1)+'×':Math.round(v)+' kg',left-6,y+4)}
 ctx.textAlign='center';periods.forEach((p,i)=>{let x=left+(periods.length===1?pw/2:pw*i/(periods.length-1));if(periods.length<=12||i%2===0)ctx.fillText(periodLabel(p,analysisState.unit),x,h-16)});
 series.forEach((s,ui)=>{ctx.strokeStyle=palette[ui%palette.length];ctx.lineWidth=2.5;ctx.beginPath();let started=false;s.values.forEach((v,i)=>{if(v==null){started=false;return}let x=left+(periods.length===1?pw/2:pw*i/(periods.length-1)),y=top+ph*(1-v/max);if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle=palette[ui%palette.length];s.values.forEach((v,i)=>{if(v==null)return;let x=left+(periods.length===1?pw/2:pw*i/(periods.length-1)),y=top+ph*(1-v/max);ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill()})});
}
window.addEventListener('resize',()=>{if(state.tab==='analysis')drawMaxChart()});

 if(o.profiles&&Object.keys(o.profiles).length)profiles=o.profiles;else if(o.profile)profiles={user1:{id:'user1',...o.profile}};
 currentUserId=o.currentUserId&&profiles[o.currentUserId]?o.currentUserId:Object.keys(profiles)[0];profile=profiles[currentUserId];migrateUserData();saveAll();alert('データを読み込みました');render();

function showLogin(show){
  const o=document.getElementById('loginOverlay');
  if(o)o.style.display=show?'flex':'none';
}
function setLoginStatus(t){
  const s=document.getElementById('loginStatus');
  if(s)s.textContent=t||'';
}
async function loginWithGoogle(){
  if(!fbAuth)return;
  setLoginStatus('Googleログイン画面を開いています…');
  try{
    // GitHub Pages + iPhone/Safariでは、リダイレクトより
    // ボタン操作から直接開くポップアップ方式の方が安定する。
    await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    await fbAuth.signInWithPopup(provider);
    // signInWithPopup成功時はonAuthStateChangedがホーム表示を行う。
    setLoginStatus('');
  }catch(e){
    console.error('Google login error:',e);
    const code=e&&e.code?e.code:'unknown';
    if(code==='auth/popup-blocked'){
      setLoginStatus('ポップアップがブロックされました。Safariのポップアップ設定を確認してください。');
    }else if(code==='auth/unauthorized-domain'){
      setLoginStatus('このドメインはFirebaseで承認されていません。');
    }else if(code==='auth/popup-closed-by-user'){
      setLoginStatus('Googleログイン画面が閉じられました。');
    }else{
      setLoginStatus('ログインに失敗しました：'+code);
    }
  }
}
async function logoutFirebase(){
  if(!fbAuth)return;
  if(confirm('ログアウトしますか？')){
    await fbAuth.signOut();
    firebaseReady=false;
    if(firebaseUnsub){firebaseUnsub();firebaseUnsub=null;}
    showLogin(true);
  }
}

function sharedPayload(){
  return {
    version: 3,
    data: data,
    menus: menus,
    plans: plans,
    templates: templates,
    profiles: profiles,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy: currentUserId
  };
}

function firebaseQueueSave(){
  firebaseSaveQueued=true;
  clearTimeout(window.__fbSaveTimer);
  window.__fbSaveTimer=setTimeout(firebaseSave,400);
}
async function firebaseSave(){
  if(!firebaseReady || firebaseLoading || firebaseSaving || !fbDb)return;
  firebaseSaving=true; firebaseSaveQueued=false;
  try{
    await fbDb.collection('shared').doc(FIREBASE_APP_ID).set(sharedPayload(),{merge:false});
  }catch(e){
    console.error('Firebase save error',e);
    alert('クラウドへの保存に失敗しました。Firestoreのルールを確認してください。');
  }finally{
    firebaseSaving=false;
    if(firebaseSaveQueued)firebaseQueueSave();
  }
}

function applyCloudSnapshot(o){
  if(!o || typeof o!=='object')return;
  if(o.data && typeof o.data==='object') data=o.data;
  if(o.menus && typeof o.menus==='object') menus=o.menus;
  if(o.plans && typeof o.plans==='object') plans=o.plans;
  if(o.templates && typeof o.templates==='object') templates=o.templates;
  if(o.profiles && typeof o.profiles==='object' && Object.keys(o.profiles).length) profiles=o.profiles;

  if(!profiles[currentUserId]){
    currentUserId=Object.keys(profiles)[0]||currentUserId;
  }
  profile=profiles[currentUserId]||{id:currentUserId,name:'自分',height:'',weight:''};
  migrateUserData();
  saveJSON(MENUKEY,menus);saveJSON(PLANKEY,plans);saveJSON(TEMPLATEKEY,templates);
  saveJSON(PROFILESKEY,profiles);saveJSON(PROFILEKEY,profile);
  localStorage.setItem(CURRENTUSERKEY,currentUserId);
}

async function loadCloud(){
  if(!fbDb)return;
  firebaseLoading=true;
  const ref=fbDb.collection('shared').doc(FIREBASE_APP_ID);
  // Authentication成功後は、Firestoreの設定状態に関係なく
  // まずアプリ本体を表示する。Firestoreは後から接続する。
  firebaseReady=true;
  try{
    const snap=await ref.get();
    if(snap.exists){
      applyCloudSnapshot(snap.data());
    }else{
      await ref.set(sharedPayload(),{merge:false});
    }

    if(firebaseUnsub)firebaseUnsub();
    firebaseUnsub=ref.onSnapshot(s=>{
      if(!s.exists || firebaseSaving)return;
      const o=s.data();
      if(o && o.updatedBy===currentUserId)return;
      firebaseLoading=true;
      try{applyCloudSnapshot(o);render();}finally{firebaseLoading=false;}
    },e=>{
      console.error('Firebase realtime error',e);
      console.log('Firestoreのルール設定後にリアルタイム共有が有効になります。');
    });
  }catch(e){
    console.error('Firebase load error',e);
    // ログイン画面には戻さない。現在端末のデータでアプリを使用可能にする。
    console.log('Firestore接続待ち:', e && e.code ? e.code : e);
  }finally{
    firebaseLoading=false;
  }
}

function addFirebaseUserName(){
  // Keep the Google user's display name available as a selectable profile.
  const user=fbAuth&&fbAuth.currentUser;
  if(!user)return;
  if(!profiles[user.uid]){
    profiles[user.uid]={
      id:user.uid,
      name:user.displayName||user.email||'利用者',
      height:'',
      weight:''
    };
    currentUserId=user.uid;
    profile=profiles[currentUserId];
    migrateUserData();
    saveAll();
  }
}

async function startFirebase(){
  if(!fbAuth)return;
  try{await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){console.warn('Auth persistence:',e);}
  fbAuth.onAuthStateChanged(async user=>{
    if(!user){
      firebaseReady=false;
      showLogin(true);
      setLoginStatus('');
      return;
    }

    // Google認証が完了した時点で、すぐホーム画面を表示。
    // Firestoreの読み込みはその後に行う。
    showLogin(false);
    setLoginStatus('');
    try{
      addFirebaseUserName();
      render();
      await loadCloud();
      render();
    }catch(e){
      console.error('Firebase startup error',e);
      // 認証済みなのでログイン画面へ戻さない。
      showLogin(false);
      render();
    }
  });
}
startFirebase();

render();

<script>
(function(){
  const HOLIDAYS={
    "2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日",
    "2026-02-23":"天皇誕生日","2026-03-20":"春分の日","2026-04-29":"昭和の日",

    "2026-05-06":"振替休日","2026-07-20":"海の日","2026-08-11":"山の日",
    "2026-09-21":"敬老の日","2026-09-22":"休日","2026-09-23":"秋分の日",
    "2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日",
    "2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日",
    "2027-02-23":"天皇誕生日","2027-03-21":"春分の日","2027-03-22":"振替休日",
    "2027-04-29":"昭和の日","2027-05-03":"憲法記念日","2027-05-04":"みどりの日",
    "2027-05-05":"こどもの日","2027-07-19":"海の日","2027-08-11":"山の日",
    "2027-09-20":"敬老の日","2027-09-23":"秋分の日","2027-10-11":"スポーツの日",
    "2027-11-03":"文化の日","2027-11-23":"勤労感謝の日"
  };

  function decorate(){
    const title=[...document.querySelectorAll("body *")].find(e=>/^20\d{2}年\d{1,2}月$/.test((e.textContent||"").trim()));
    if(!title) return;
    const m=(title.textContent||"").trim().match(/^(20\d{2})年(\d{1,2})月$/);
    if(!m) return;
    const year=+m[1], month=+m[2];
    document.querySelectorAll(".day").forEach(cell=>{
      cell.classList.remove("sat","sun","holiday");
      const mt=(cell.textContent||"").match(/(?:^|\s)(\d{1,2})(?:\s|$)/);
      if(!mt) return;
      const day=+mt[1];
      if(day<1 || day>31) return;
      const d=new Date(year,month-1,day);
      if(d.getMonth()!==month-1) return;
      const iso=year+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
      if(HOLIDAYS[iso]) cell.classList.add("holiday");
      else if(d.getDay()===0) cell.classList.add("sun");
      else if(d.getDay()===6) cell.classList.add("sat");
    });
  }

  new MutationObserver(decorate).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("click",()=>setTimeout(decorate,50));
  setTimeout(decorate,100);
  setTimeout(decorate,500);
  setTimeout(decorate,1500);
})();
</script></body>
</html>
