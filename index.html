<head>
<meta charset="utf-8">

<title>筋トレ記録</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f5f7;color:#222}
header{position:sticky;top:0;z-index:10;background:#fff;padding:14px 16px;font-size:20px;font-weight:700;border-bottom:1px solid #ddd}
main{padding:14px 14px 90px;max-width:900px;margin:auto}.screen{display:none}.screen.active{display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #00000012}
h2{font-size:18px;margin:4px 0 12px}.muted{color:#777;font-size:13px}.small{font-size:12px}
button,select,input,textarea{font:inherit}button{border:0;border-radius:10px;padding:9px 12px;background:#222;color:#fff;cursor:pointer}
button.sub{background:#eee;color:#222}button.danger{background:#d33}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:9px;background:#fff}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid #ddd;display:flex;padding:7px 4px env(safe-area-inset-bottom)}
.nav{flex:1;text-align:center;background:none;color:#777;padding:7px 2px;font-size:11px}.nav.active{color:#111;font-weight:700}
.nav span{display:block;font-size:20px;margin-bottom:2px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:11px;color:#888;padding:4px}
.day{min-height:54px;background:#e9e9ed;color:#222;border-radius:9px;padding:5px;text-align:left;font-size:12px;position:relative}.day.selected{background:#fff;outline:3px solid #222}.dow{color:#555;font-weight:600}.marks{margin-top:5px;font-size:13px;line-height:1.2}
.day.other{opacity:.35}.day.selected{outline:2px solid #222}.daynum{font-weight:600}.marks{margin-top:5px;font-size:12px;line-height:1.15}
.preview-scroll{max-height:none;overflow:visible}.home-preview-tabs{display:flex;gap:6px;margin:0 0 10px}.home-tab{flex:1;background:#eee;color:#555;padding:8px 6px}.home-tab.active{background:#222;color:#fff}.workout{border:1px solid #ddd;border-radius:11px;padding:11px;margin:8px 0}
.workout-title{font-weight:700}.workout-meta{font-size:12px;color:#666;margin-top:3px}
.sets{margin-top:7px}.set{display:flex;gap:8px;font-size:13px;padding:4px 0;white-space:nowrap}
.memo{background:#fff8d9;border-radius:9px;padding:9px;margin-top:8px;white-space:pre-wrap}
.section-title{font-weight:700;margin:16px 0 7px}.exercise-list{display:flex;flex-direction:column;gap:6px}
.exercise-item{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:9px;padding:9px}
.modal-bg{display:none;position:fixed;inset:0;background:#0007;z-index:50;padding:20px;overflow:auto}.modal-bg.show{display:block}
.modal{background:#fff;border-radius:15px;max-width:650px;margin:30px auto;padding:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center}.close{background:#eee;color:#222}
.set-input{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:end;margin:6px 0}
.analysis-controls{display:grid;gap:8px}.user-checks{display:flex;gap:7px;flex-wrap:wrap}.user-check{border:1px solid #ccc;border-radius:20px;padding:7px 10px;font-size:13px}
.user-check input{width:auto;margin-right:4px}.chart-wrap{height:290px}.chart-wrap canvas{width:100%;height:290px;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin:8px 0}.legend-item{display:flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#f7f7f7;border-radius:10px;padding:10px}.stat b{font-size:18px;display:block}
.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid #eee;padding:7px;text-align:left}

.analysis-tabs{display:flex;gap:6px;margin-bottom:10px}.analysis-tab{flex:1;background:#eee;color:#555}.analysis-tab.active{background:#222;color:#fff}
.analysis-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.analysis-kpi{background:#f7f7f8;border-radius:10px;padding:10px}.analysis-kpi span{font-size:11px;color:#777}.analysis-kpi b{display:block;font-size:18px;margin-top:3px}
.photo-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.photo-stat{border:1px solid #ddd;border-radius:10px;padding:10px}.photo-stat b{display:block;font-size:18px;margin-top:3px}
.morph-box{background:#f7f7f8;border-radius:12px;padding:10px}.morph-canvas{display:block;width:100%;height:360px;object-fit:contain;background:#ddd;border-radius:10px}.range-wide{width:100%}
@media(max-width:560px){.analysis-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.photo-stats{grid-template-columns:1fr}.morph-canvas{height:300px}}

.empty{text-align:center;color:#888;padding:20px}.note{font-size:12px;color:#666;line-height:1.5}
</style>

<style id="food-v3-safe-css">

.food-kpi{background:#f7f7f8;border-radius:10px;padding:9px;text-align:center}
.food-kpi b{display:block;font-size:17px;margin-top:3px}.food-kpi span{font-size:11px;color:#777}

.pfc-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:8px 0}

<body>

<div id="loginOverlay">
  <div id="loginCard">
    <h2>筋トレ記録</h2>
    <p>複数人で記録を共有するには<br>Googleアカウントでログインしてください。</p>
    <button id="loginBtn" onclick="loginWithGoogle()">Googleでログイン</button>
    <div id="loginStatus" class="firebase-badge"></div>
  </div>
</div>

<header>筋トレ記録</header>
<main>
<section id="calendar" class="screen active"></section>
<section id="menu" class="screen"></section>
<section id="analysis" class="screen"></section>
<section id="settings" class="screen"></section>
</main>
<nav class="bottom">
<button class="nav active" data-tab="calendar"><span>🏠</span>ホーム</button>
<button class="nav" data-tab="menu"><span>📋</span>種目</button>
<button class="nav" data-tab="analysis"><span>📊</span>分析</button>
<button class="nav" data-tab="settings"><span>⚙️</span>メニュー</button>
</nav>
<input id="photoCameraInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoSelected(this)">
<input id="photoLibraryInput" type="file" accept="image/*" style="display:none" onchange="handlePhotoSelected(this)">
<div id="modalBg" class="modal-bg" onclick="modalBackground(event)"><div id="modal" class="modal"></div></div>

<script>
const KEY='kintoreData',MENUKEY='kintoreMenus',PLANKEY='kintorePlans',PROFILEKEY='kintoreProfile',TEMPLATEKEY='kintoreTemplates';
const FIREBASE_APP_ID='shared';
let firebaseReady=false, firebaseLoading=false, firebaseSaving=false, firebaseSaveQueued=false, firebaseUnsub=null;
const PROFILESKEY='kintoreProfiles',CURRENTUSERKEY='kintoreCurrentUser';

const categories=['胸','背中','肩','腕','脚','腹','有酸素','その他'];
const cardioExercises=['ランニング','ジョギング','ウォーキング','サイクリング','水泳','その他'];
const defaultMenus={
胸:['ベンチプレス','チェストプレス','ダンベルプレス','ディップス'],
背中:['懸垂','ラットプルダウン','ローイング','ワンハンドロー'],
肩:['ショルダープレス','サイドレイズ','フロントレイズ'],
腕:['アームカール','ハンマーカール','トライセプスプレスダウン'],
脚:['スクワット','スミスマシンスクワット','レッグプレス','レッグカール','カーフレイズ'],
腹:['アブドミナル','レッグレイズ','ケーブルクランチ'],
有酸素:cardioExercises.slice(),
その他:['その他']
};
function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}
function isoToday(){let d=new Date();return localDate(d)}
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function formatDate(s){let d=new Date(s+'T00:00:00');return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
let data=loadJSON(KEY,{});
let menus=loadJSON(MENUKEY,defaultMenus);
let plans=loadJSON(PLANKEY,{});
let templates=loadJSON(TEMPLATEKEY,{});
let profiles=loadJSON(PROFILESKEY,null);
let legacyProfile=loadJSON(PROFILEKEY,{name:'利用者',height:'',weight:''});

if(!profiles||!Object.keys(profiles).length){
  profiles={user1:{id:'user1',name:legacyProfile.name||'利用者',height:legacyProfile.height||'',weight:legacyProfile.weight||'',visibility:{workout:true,food:false,photo:false}}};
}
let currentUserId=localStorage.getItem(CURRENTUSERKEY)||Object.keys(profiles)[0];
if(!profiles[currentUserId])currentUserId=Object.keys(profiles)[0];
let profile=profiles[currentUserId];
if(profile&&!profile.visibility)profile.visibility={workout:true,food:false,photo:false};

function mergeDefaultMenus(){
  categories.forEach(c=>{
    if(!Array.isArray(menus[c]))menus[c]=[];
    defaultMenus[c].forEach(x=>{if(!menus[c].includes(x))menus[c].push(x)});
  });
  saveJSON(MENUKEY,menus);
}
mergeDefaultMenus();

function migrateUserData(){
  Object.keys(profiles||{}).forEach(id=>{if(profiles[id]&&!profiles[id].visibility)profiles[id].visibility={workout:true,food:false,photo:false}});
  Object.keys(data).forEach(date=>{
    let r=data[date]; if(!r||typeof r!=='object')return;
    if(!Array.isArray(r.workouts))r.workouts=[];
    r.workouts.forEach(w=>{if(!w.userId)w.userId=currentUserId});
    if(!r.memos){
      r.memos={};
      if(r.memo)r.memos[currentUserId]=r.memo;
    }
  });
  saveJSON(KEY,data);saveJSON(PROFILESKEY,profiles);localStorage.setItem(CURRENTUSERKEY,currentUserId);
}
migrateUserData();

let state={tab:'calendar',date:isoToday(),month:new Date(),modalWorkout:null,modalEditIndex:null,photoFile:null};
let analysisState={section:'workout',unit:'month',span:12,metric:'weight',exerciseKey:'',users:[currentUserId],morphOrientation:'正面',morphPos:0,morphPlaying:false};

function saveAll(){
  saveJSON(KEY,data);saveJSON(MENUKEY,menus);saveJSON(PLANKEY,plans);saveJSON(TEMPLATEKEY,templates);
  saveJSON(PROFILESKEY,profiles);saveJSON(PROFILEKEY,profiles[currentUserId]);
  localStorage.setItem(CURRENTUSERKEY,currentUserId);
  if(firebaseReady && !firebaseLoading) firebaseQueueSave();
}

function workoutUser(w){return w.userId||currentUserId}
function getRecord(date){
  let r=data[date]||{workouts:[],memo:''};
  let workouts=(r.workouts||[]).filter(w=>workoutUser(w)===currentUserId);
  let memo=r.memos&&Object.prototype.hasOwnProperty.call(r.memos,currentUserId)?r.memos[currentUserId]:(r.memos? '':(r.memo||''));
  return {workouts,memo};
}
function hasWorkout(date){return getRecord(date).workouts.length>0}
function hasMemo(date){return !!getRecord(date).memo}
function hasPlan(date){return !!plans[date]}
function showTab(t){state.tab=t;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(t).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>showTab(x.dataset.tab));

function render(){if(state.tab==='calendar')renderHome();if(state.tab==='menu')renderMenu();if(state.tab==='analysis')renderAnalysis();if(state.tab==='settings')renderSettings()}

function renderHome(){
  let el=document.getElementById('calendar');
  el.innerHTML=`<div class="card">${renderCalendar()}</div><div id="dayPreview"></div>`;
  renderHomePreview();
}
function isHolidayDate(ds){
  const holidays={
    '2026-01-01':1,'2026-01-12':1,'2026-02-11':1,'2026-02-23':1,'2026-03-20':1,'2026-04-29':1,'2026-05-03':1,'2026-05-04':1,'2026-05-05':1,'2026-05-06':1,'2026-07-20':1,'2026-08-11':1,'2026-09-21':1,'2026-09-22':1,'2026-09-23':1,'2026-10-12':1,'2026-11-03':1,'2026-11-23':1,
    '2027-01-01':1,'2027-01-11':1,'2027-02-11':1,'2027-02-23':1,'2027-03-21':1,'2027-03-22':1,'2027-04-29':1,'2027-05-03':1,'2027-05-04':1,'2027-05-05':1,'2027-07-19':1,'2027-08-11':1,'2027-09-20':1,'2027-09-23':1,'2027-10-11':1,'2027-11-03':1,'2027-11-23':1
  };
  return !!holidays[ds];
}
function renderCalendar(){
  let y=state.month.getFullYear(),m=state.month.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);
  let html=`<div class="calendar-head"><button class="sub" onclick="moveMonth(-1)">‹</button><b>${y}年${m+1}月</b><button class="sub" onclick="moveMonth(1)">›</button></div><div class="calendar">`;
  ['日','月','火','水','木','金','土'].forEach(x=>html+=`<div class="dow">${x}</div>`);
  for(let i=0;i<first.getDay();i++)html+=`<div></div>`;
  for(let d=1;d<=last.getDate();d++){
    let dateObj=new Date(y,m,d),ds=localDate(dateObj),cls=(ds===state.date?' selected':'')+(dateObj.getDay()===6?' sat':'')+(dateObj.getDay()===0?' sun':'')+(isHolidayDate(ds)?' holiday':'');
    let marks=(hasWorkout(ds)?'🔥':'')+(hasPlan(ds)?' 📅':'')+(hasMemo(ds)?' 📝':'');
    html+=`<button class="day${cls}" onclick="openDate('${ds}')"><div class="daynum">${d}</div><div class="marks">${marks}</div></button>`;
  }
  html+='</div><div class="note" style="margin-top:8px">🔥記録　📅予定　📝メモ</div>';return html;
}
function openDate(d){state.date=d;render()}
function moveMonth(n){state.month.setMonth(state.month.getMonth()+n);render()}

function renderHomePreview(){
  let el=document.getElementById('dayPreview');
  el.innerHTML=`<div class="card"><h2>${formatDate(state.date)}</h2><div class="home-preview-tabs"><button class="home-tab active" data-home-tab="workout" onclick="setHomePreviewTab('workout')">🏋️ 筋トレ</button><button class="home-tab" data-home-tab="meal" onclick="setHomePreviewTab('meal')">🍚 食事</button><button class="home-tab" data-home-tab="photo" onclick="setHomePreviewTab('photo')">📸 身体</button></div><div id="homePreviewContent"></div><div id="homePreviewActions" class="row" style="margin-top:10px"></div></div>`;
  setHomePreviewTab('workout');
}
function setHomePreviewTab(tab){
  document.querySelectorAll('.home-tab').forEach(b=>b.classList.toggle('active',b.dataset.homeTab===tab));
  const el=document.getElementById('homePreviewContent'); if(!el)return;
  const actions=document.getElementById('homePreviewActions');
  if(tab==='workout'){renderHomeWorkoutPreview(el);actions.innerHTML=`<button onclick="addWorkout()">＋記録</button><button class="sub" onclick="openDayMemoModal()">📝 メモ追加</button>`;}
  else if(tab==='meal'){renderHomeMealPreview(el);actions.innerHTML=`<button onclick="openMealAddModal()">🍚 食事を追加</button>`;}
  else {renderHomePhotoPreview(el);actions.innerHTML=`<button onclick="openPhotoSourceModal()">📸 写真を追加</button>`;}
}
function renderHomeWorkoutPreview(el){
  let r=getRecord(state.date),html='';
  if(r.workouts.length)r.workouts.forEach((w,i)=>html+=homeWorkoutHTML(w,i));
  else if(!hasPlan(state.date))html+=`<div class="empty">この日の筋トレ記録はありません</div>`;
  if(r.memo)html+=`<div class="section-title">その日のメモ</div><div class="memo">${esc(r.memo)}</div>`;
  el.innerHTML=html;
}
function getMeals(date){
  const r=data[date]||{};
  return Array.isArray(r.meals)?r.meals.filter(x=>(x.userId||currentUserId)===currentUserId):[];
}
function mealTotals(date){
  return getMeals(date).reduce((a,m)=>{a.cal+=parseFloat(m.cal)||0;a.p+=parseFloat(m.p)||0;a.f+=parseFloat(m.f)||0;a.c+=parseFloat(m.c)||0;return a},{cal:0,p:0,f:0,c:0});
}
function renderHomeMealPreview(el){
  const meals=getMeals(state.date),t=mealTotals(state.date);
  let h=`<div class="food-summary">
  <div class="food-kpi"><span>カロリー</span><b>${Math.round(t.cal)} kcal</b></div>
  <div class="food-kpi"><span>たんぱく質</span><b>${t.p.toFixed(1)} g</b></div>
  <div class="food-kpi"><span>脂質</span><b>${t.f.toFixed(1)} g</b></div>
  <div class="food-kpi"><span>炭水化物</span><b>${t.c.toFixed(1)} g</b></div></div>`;
  if(!meals.length) h+=`<div class="empty">この日の食事記録はまだありません</div>`;

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(',')[1]||'');
    r.onerror=reject;r.readAsDataURL(file);
  });
}
async function analyzeMealPhoto(){
  syncMealDraft();
  const file=mealDraftPhoto||document.getElementById('mealPhoto')?.files?.[0];
  if(!file){alert('先に食事画像を選択してください');return}
  const key=getGeminiApiKey();
  if(!key){
    alert('食事AIを使うにはGemini APIキーの設定が必要です。食事AI設定から登録してください。');
    openFoodAISettings();return;
  }
  if(file.size>18*1024*1024){alert('画像が大きすぎます。18MB未満の画像を使用してください。');return}
  const btn=document.getElementById('mealAIButton');if(btn){btn.disabled=true;btn.textContent='🤖 判定中…';}
  try{
    const b64=await fileToBase64(file);
    const mime=file.type||'image/jpeg';
    const prompt=`あなたは食事記録アシスタントです。この料理写真を見て、写っている食べ物をできるだけ具体的に推定してください。
目的はカロリーとPFC管理です。画像だけでは正確な重量が分からないため、一般的な一人前として妥当な推定量(g)を設定してください。
汁物、調味料、ドレッシング、主食も可能な範囲で含めてください。
必ずJSONだけを返してください。Markdownや説明文は不要です。
形式:
{"items":[{"name":"食品名","amount":100,"cal":168,"p":2.5,"f":0.3,"c":37.1}]}
calはkcal、p/f/cはg。数値は推定値で、確信が低い場合も妥当な範囲の値を入れてください。`;
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:mime,data:b64}}]}],
        generationConfig:{responseMimeType:'application/json',temperature:0.2}})
    });
    if(!res.ok){
      let detail='';try{const er=await res.json();detail=er?.error?.message||''}catch(_){}
      throw new Error('API error '+res.status+(detail?'：'+detail:''));
    }
    const json=await res.json();
    const raw=json?.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('')||'';
    const parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
    if(!Array.isArray(parsed.items)||!parsed.items.length)throw new Error('判定結果なし');
    mealDraftItems=parsed.items.map(x=>({
      name:String(x.name||''),
      amount:String(x.amount??''),
      cal:String(Math.round(Number(x.cal)||0)),
      p:String((Number(x.p)||0).toFixed(1)),
      f:String((Number(x.f)||0).toFixed(1)),
      c:String((Number(x.c)||0).toFixed(1))
    }));
    renderMealRowsOnly();updateMealDraftSummary();
    const status=document.getElementById('mealAIStatus');if(status)status.innerHTML='🤖 AI推定を反映しました。<b>必ず内容・量・数値を確認してから保存してください。</b>';
  }catch(e){
    console.error(e);
    alert('AI判定に失敗しました。\n'+(e?.message||'APIキー、通信状態、画像形式を確認してください。'));
  }finally{if(btn){btn.disabled=false;btn.textContent='🤖 画像からAI推定';}}
}

function loadFirebaseStorageSDK(){

    const existing=document.querySelector('script[data-firebase-storage="1"]');
    if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',reject,{once:true});return;}
    const script=document.createElement('script');

    script.dataset.firebaseStorage='1';
    script.onload=resolve;script.onerror=reject;document.head.appendChild(script);
  });
}

};

function foodKey(name){
  name=String(name||'').trim();
  if(foodDB[name])return name;
  return Object.keys(foodDB).find(k=>name.includes(k)||k.includes(name))||'';
}
function estimateFood(name,amount){
  const key=foodKey(name),f=foodDB[key];
  if(!f)return null;
  const n=parseFloat(amount);
  if(!Number.isFinite(n)||n<=0)return null;
  const factor=key==='プロテイン'?n:n/100;
  return {cal:Math.round(f.cal*factor),p:+(f.p*factor).toFixed(1),f:+(f.f*factor).toFixed(1),c:+(f.c*factor).toFixed(1)};
}
function mealDraftTotals(){
  return mealDraftItems.reduce((a,x)=>{
    a.cal+=+x.cal||0;a.p+=+x.p||0;a.f+=+x.f||0;a.c+=+x.c||0;return a
  },{cal:0,p:0,f:0,c:0});
}

function firebaseQueueSave(){

  window.__fbSaveTimer=setTimeout(firebaseSave,400);
}
async function firebaseSave(){
  if(!firebaseReady || firebaseLoading || firebaseSaving || !fbDb)return;
  firebaseSaving=true; firebaseSaveQueued=false;
  try{
    await fbDb.collection('shared').doc(FIREBASE_APP_ID).set(sharedPayload(),{merge:false});
  }catch(e){
    console.error('Firebase save error',e);
    alert('クラウドへの保存に失敗しました。Firestoreのルールを確認してください。');
  }finally{
    firebaseSaving=false;
    if(firebaseSaveQueued)firebaseQueueSave();
  }
}

function applyCloudSnapshot(o){
  if(!o || typeof o!=='object')return;
  if(o.data && typeof o.data==='object') data=o.data;
  if(o.menus && typeof o.menus==='object') menus=o.menus;
  if(o.plans && typeof o.plans==='object') plans=o.plans;
  if(o.templates && typeof o.templates==='object') templates=o.templates;
  if(o.profiles && typeof o.profiles==='object' && Object.keys(o.profiles).length) profiles=o.profiles;

  if(!profiles[currentUserId]){
    currentUserId=Object.keys(profiles)[0]||currentUserId;
  }
  profile=profiles[currentUserId]||{id:currentUserId,name:'利用者',height:'',weight:''};
  migrateUserData();
  saveJSON(MENUKEY,menus);saveJSON(PLANKEY,plans);saveJSON(TEMPLATEKEY,templates);
  saveJSON(PROFILESKEY,profiles);saveJSON(PROFILEKEY,profile);
  localStorage.setItem(CURRENTUSERKEY,currentUserId);
}

async function loadCloud(){
  if(!fbDb)return;
  firebaseLoading=true;
  const ref=fbDb.collection('shared').doc(FIREBASE_APP_ID);
  // Authentication成功後は、Firestoreの設定状態に関係なく
  // まずアプリ本体を表示する。Firestoreは後から接続する。
  firebaseReady=true;
  try{
    const snap=await ref.get();
    if(snap.exists){
      applyCloudSnapshot(snap.data());
    }else{
      await ref.set(sharedPayload(),{merge:false});
    }

    if(firebaseUnsub)firebaseUnsub();
    firebaseUnsub=ref.onSnapshot(s=>{
      if(!s.exists || firebaseSaving)return;
      const o=s.data();
      if(o && o.updatedBy===currentUserId)return;
      firebaseLoading=true;
      try{applyCloudSnapshot(o);render();}finally{firebaseLoading=false;}
    },e=>{
      console.error('Firebase realtime error',e);
      console.log('Firestoreのルール設定後にリアルタイム共有が有効になります。');
    });
  }catch(e){
    console.error('Firebase load error',e);
    // ログイン画面には戻さない。現在端末のデータでアプリを使用可能にする。
    console.log('Firestore接続待ち:', e && e.code ? e.code : e);
  }finally{
    firebaseLoading=false;
  }
}

    profiles[user.uid]={
      id:user.uid,
      name:user.displayName||user.email||'利用者',
      height:'',
      weight:'',
      visibility:{workout:true,food:false,photo:false}
    };
    currentUserId=user.uid;
    profile=profiles[currentUserId];
    migrateUserData();
    saveAll();
  }
}

async function startFirebase(){
  if(!fbAuth)return;

  try{
    await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  }catch(e){
    console.warn('Auth persistence:',e);
  }

  fbAuth.onAuthStateChanged(async user=>{
    if(!user){
      firebaseReady=false;
      showLogin(true);
      setLoginStatus('');
      return;
    }

    // 認証済みなら、Firestoreの読み込みを待たずにアプリ本体を表示。
    showLogin(false);
    setLoginStatus('');

    try{
      addFirebaseUserName();
      render();
      await loadCloud();
      render();
    }catch(e){
      console.error('Firebase startup error',e);
      showLogin(false);
      render();
    }
  });

  // iOSホーム画面のWebアプリでは、認証後の戻り処理が
  // 通常ブラウザと異なることがあるため、redirect結果は安全に確認する。
  try{
    const result=await fbAuth.getRedirectResult();
    if(result && result.user){
      console.log('Google redirect login completed');
    }
  }catch(e){
    console.error('Google redirect error:',e);
    const code=e&&e.code?e.code:'unknown';
    if(code!=='auth/no-auth-event' && code!=='auth/popup-closed-by-user'){
      console.warn('Google auth result:',code);
    }
  }
}
startFirebase();

render();
</script>
<script>
(function(){
  const HOLIDAYS={
    "2026-01-01":"元日","2026-01-12":"成人の日","2026-02-11":"建国記念の日",
    "2026-02-23":"天皇誕生日","2026-03-20":"春分の日","2026-04-29":"昭和の日",
    "2026-05-03":"憲法記念日","2026-05-04":"みどりの日","2026-05-05":"こどもの日",
    "2026-05-06":"振替休日","2026-07-20":"海の日","2026-08-11":"山の日",
    "2026-09-21":"敬老の日","2026-09-22":"休日","2026-09-23":"秋分の日",
    "2026-10-12":"スポーツの日","2026-11-03":"文化の日","2026-11-23":"勤労感謝の日",
    "2027-01-01":"元日","2027-01-11":"成人の日","2027-02-11":"建国記念の日",
    "2027-02-23":"天皇誕生日","2027-03-21":"春分の日","2027-03-22":"振替休日",
    "2027-04-29":"昭和の日","2027-05-03":"憲法記念日","2027-05-04":"みどりの日",
    "2027-05-05":"こどもの日","2027-07-19":"海の日","2027-08-11":"山の日",
    "2027-09-20":"敬老の日","2027-09-23":"秋分の日","2027-10-11":"スポーツの日",
    "2027-11-03":"文化の日","2027-11-23":"勤労感謝の日"
  };

  function decorate(){
    const title=[...document.querySelectorAll("body *")].find(e=>/^20\d{2}年\d{1,2}月$/.test((e.textContent||"").trim()));
    if(!title) return;
    const m=(title.textContent||"").trim().match(/^(20\d{2})年(\d{1,2})月$/);
    if(!m) return;
    const year=+m[1], month=+m[2];
    document.querySelectorAll(".day").forEach(cell=>{
      cell.classList.remove("sat","sun","holiday");
      const numEl=cell.querySelector(".daynum");
      const mt=(numEl?.textContent||"").trim().match(/^(\d{1,2})$/);
      if(!mt) return;
      const day=+mt[1];
      if(day<1 || day>31) return;
      const d=new Date(year,month-1,day);
      if(d.getMonth()!==month-1) return;
      const iso=year+"-"+String(month).padStart(2,"0")+"-"+String(day).padStart(2,"0");
      if(HOLIDAYS[iso]) cell.classList.add("holiday");
      else if(d.getDay()===0) cell.classList.add("sun");
      else if(d.getDay()===6) cell.classList.add("sat");
    });
  }

  new MutationObserver(decorate).observe(document.body,{childList:true,subtree:true});
  document.addEventListener("click",()=>setTimeout(decorate,50));
  setTimeout(decorate,100);
  setTimeout(decorate,500);
  setTimeout(decorate,1500);
})();
</script>

<script>
(function(){
  const PREFIX='kintoreUserData_';
  const OLD='kintoreData';

  function user(){
    try{return window.fbAuth&&window.fbAuth.currentUser?window.fbAuth.currentUser:null}catch(e){return null}
  }
  function read(k,f){
    try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}
  }
  function write(k,v){
    try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){console.warn(e);return false}
  }
  function migrate(){
    const u=user(); if(!u)return;
    const k=PREFIX+u.uid;
    if(localStorage.getItem(k)===null){
      const old=read(OLD,null);
      write(k,old===null?{}:old);
    }
  }
  function accountBar(){
    let bar=document.getElementById('accountBarV2');
    if(!bar){
      bar=document.createElement('div');
      bar.id='accountBarV2';
      const target=document.querySelector('header')||document.body.firstElementChild||document.body;
      if(getComputedStyle(target).position==='static')target.style.position='relative'; target.appendChild(bar);
    }
    const u=user();
    if(!u){bar.innerHTML='<span>ログインしていません</span>';return}
    const name=(u.displayName||'Googleユーザー').replace(/[<>]/g,'');
    const email=(u.email||'').replace(/[<>]/g,'');
    bar.innerHTML='<div><span>👤</span><span class="account-name">'+name+'</span></div>'+
      '<button type="button" id="accountLogoutV2" aria-label="ログアウト" title="ログアウト">↪ ログアウト</button>';
    bar.title=email||name;
    const b=document.getElementById('accountLogoutV2');
    if(b)b.onclick=async function(){
      try{if(window.fbAuth)await window.fbAuth.signOut()}catch(e){console.error(e)}
    };
  }

  window.kintoreUserDataV2={
    getUser:function(){return user()},
    getKey:function(){const u=user();return u?PREFIX+u.uid:null},
    load:function(){const u=user();if(!u)return null;migrate();return read(PREFIX+u.uid,{})},
    save:function(data){const u=user();return u?write(PREFIX+u.uid,data):false},
    migrate:migrate
  };

  function hook(){
    if(window.fbAuth&&window.fbAuth.onAuthStateChanged){
      window.fbAuth.onAuthStateChanged(function(u){if(u)migrate();accountBar()});
      accountBar(); return true;
    }
    return false;
  }
  let n=0;
  const t=setInterval(function(){if(hook()||++n>40)clearInterval(t)},250);
})();
</script>

)}</td>${cats.map(c=>`<td>${Math.round(v[c]||0).toLocaleString()}</td>`).join('')}</tr>`}).join('')}</table></div><div class="note">単位：kg（重量×回数）</div></div>`;return h}
  function currentMonthDaySlots31(){const now=new Date(),y=now.getFullYear(),m=now.getMonth();return Array.from({length:31},(_,i)=>{const d=new Date(y,m,i+1);return i+1<=new Date(y,m+1,0).getDate()?localDate(d):null;});}

    // Estimate from logged strength-training volume/time when available.

  function meal(){

    </div>`;
    h+=`<div class="analysis-v10-card"><h3>今月の栄養状況</h3>
      <table class="analysis-v10-table"><tr><th>項目</th><th>月合計</th><th>3食記録日の1日平均</th></tr>
      <tr><td>カロリー</td><td>${Math.round(t.cal||0).toLocaleString()} kcal</td><td>${Math.round(avg.cal).toLocaleString()} kcal</td></tr>

      <tr><td>脂質</td><td>${(+t.f||0).toFixed(1)} g</td><td>${avg.f.toFixed(1)} g</td></tr>
      <tr><td>糖質</td><td>${(+t.c||0).toFixed(1)} g</td><td>${avg.c.toFixed(1)} g</td></tr></table>
      <div class="note">平均は朝食・昼食・夕食の3食すべてを記録した日のみで計算しています（${n}日）。</div></div>`;
    h+=`<div class="analysis-v10-card"><h3>日別カロリー推移</h3><div class="analysis-v13-chart-wrap"><canvas id="afixMealCalChart" class="analysis-v13-chart"></canvas></div><div class="note">直近30日のカロリー。</div></div>`;
    h+=`<div class="analysis-v10-card"><h3>P・F・C（糖質）推移</h3><div class="analysis-v13-chart-wrap"><canvas id="afixMealPfcChart" class="analysis-v13-chart"></canvas><div id="v24PfcLegend" class="pfc-legend">
<span><i class="pfc-dot" style="background:#1f77b4"></i>P＝たんぱく質</span>
<span><i class="pfc-dot" style="background:#d62728"></i>F＝脂質</span>

</div></div><div class="note">P・F・糖質をそれぞれ別色で表示。</div></div>`;

    let rows='';

  function drawMealLine(id,rows,series,suffix){

    c.width=w*d;c.height=h*d;const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);

    const x=i=>L+(rows.length===1?pw/2:pw*i/(rows.length-1));
    const palette=['#1f77b4','#d62728','#2ca02c','#9467bd'];
    series.forEach((s,si)=>{
      const col=palette[si%palette.length];ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.2;ctx.beginPath();let started=false;
      rows.forEach((q,i)=>{const v=+q[s.key]||0;if(v<=0)return;const xx=x(i),yy=T+ph*(1-v/mx);if(!started){ctx.moveTo(xx,yy);started=true}else ctx.lineTo(xx,yy)});ctx.stroke();
      rows.forEach((q,i)=>{const v=+q[s.key]||0;if(v<=0)return;const xx=x(i),yy=T+ph*(1-v/mx);ctx.beginPath();ctx.arc(xx,yy,2.7,0,Math.PI*2);ctx.fill()});
    });
    ctx.fillStyle='#666';ctx.textAlign='center';const step=rows.length<=12?1:Math.ceil(rows.length/7);

  function drawMealCharts(){

    function completeTotals(s,e){
      const out=[],st=new Date(s+'T00:00:00'),en=new Date(e+'T00:00:00');

        const date=localDate(d),ms=getMeals(date);
        if(['朝食','昼食','夕食'].every(type=>ms.some(m=>m.type===type)))out.push(mealRangeTotals(currentUserId,date,date));

    const now=new Date(),weeks=[];
    for(let i=11;i>=0;i--){

    notes.push('筋トレ：重量・回数の推移を見ながら、フォームを崩さず少しずつ負荷または回数を伸ばすのが基本です。');
    notes.push('食事：P・F・Cのバランスだけでなく、3食の記録がそろっている日を増やすと平均値の信頼性が上がります。');
    if(p.bmr)notes.push(`入力した基礎代謝量：${p.bmr} kcal/日。推定1日総消費カロリーは活動量を加味した概算値です。`);
    return notes.join('\\n');
  }

  function body(){const ps=safe(()=>photoRecords(currentUserId),[]),dirs=['正面','背面','左側面','右側面'];S.dir=S.dir||'正面';let h='<div class="analysis-v10-photo-grid">';dirs.forEach(o=>{const a=ps.filter(p=>p.orientation===o);h+=`<div class="analysis-v10-photo-stat"><span>${o}</span><b>${a.length}枚</b><div class="note">最も古い日付：${a.length?a[0].date:'—'}</div></div>`});h+='</div>';h+=`<div class="analysis-v10-card"><h3>身体写真モーフィング</h3><div class="row"><div style="flex:1"><label>方向</label><select id="afixDir">${dirs.map(o=>`<option ${S.dir===o?'selected':''}>${o}</option>`).join('')}</select></div><button id="afixPlay" type="button">▶️ 再生</button></div><canvas id="afixMorph" style="width:100%;height:300px;display:block;background:#eee;border-radius:10px;margin-top:10px"></canvas><input id="afixSeek" type="range" min="0" max="1000" value="${S.pos||0}" style="width:100%"><div class="note" id="afixLabel"></div><label>速度 <select id="afixSpeed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select>倍</label></div>`;return h}
  function drawMorph(){const c=document.getElementById('afixMorph'),lab=document.getElementById('afixLabel');if(!c)return;const ps=safe(()=>photoRecords(currentUserId).filter(p=>p.orientation===S.dir&&p.url),[]),r=c.getBoundingClientRect(),w=Math.max(300,r.width),h=300,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);if(!ps.length){ctx.fillStyle='#777';ctx.textAlign='center';ctx.fillText('この方向の写真がありません',w/2,h/2);if(lab)lab.textContent='写真なし';return}const draw=(u,a)=>{const im=new Image();im.onload=()=>{ctx.globalAlpha=a;const z=Math.min(w/im.width,h/im.height),dw=im.width*z,dh=im.height*z;ctx.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);ctx.globalAlpha=1};im.src=u};if(ps.length===1){draw(ps[0].url,1);lab.textContent=ps[0].date;return}const t=(S.pos||0)/1000*(ps.length-1),i=Math.min(ps.length-2,Math.floor(t)),a=t-i;draw(ps[i].url,1-a);draw(ps[i+1].url,a);lab.textContent=`${ps[i].date} → ${ps[i+1].date} ${Math.round(a*100)}%`}
  function play(){S.playing=!S.playing;const b=document.getElementById('afixPlay');if(b)b.textContent=S.playing?'⏸️ 停止':'▶️ 再生';S.last=0;if(S.playing)requestAnimationFrame(tick)}
  function tick(ts){if(!S.playing)return;const sp=parseFloat(document.getElementById('afixSpeed')?.value||1);if(!S.last)S.last=ts;S.pos=(S.pos||0)+(ts-S.last)*0.06*sp;S.last=ts;if(S.pos>1000)S.pos=0;const r=document.getElementById('afixSeek');if(r)r.value=S.pos;drawMorph();requestAnimationFrame(tick)}
  window.addEventListener('load',()=>setTimeout(()=>{if(state?.tab==='analysis')render()},300));
  document.addEventListener('click',e=>{const n=e.target.closest?.('.nav[data-tab="analysis"]');if(n)setTimeout(()=>render(),50)});
  window.addEventListener('resize',()=>{if(state?.tab==='analysis'){if(S.tab==='workout')draw();if(S.tab==='meal')drawMealCharts();if(S.tab==='body')drawMorph()}});
  window.analysisHardFix={render};
})();
</script>

<style>
.analysis-v13-chart{width:100%;height:260px;display:block;background:#fff;border-radius:12px}
.analysis-period-caption{font-size:13px;color:#777;text-align:center;margin:10px 0 -4px;font-weight:600}
.analysis-weight-card .note{line-height:1.6}
.analysis-v13-chart-wrap{min-height:260px}
.analysis-v13-chart-wrap{margin-top:10px;min-height:240px}
.analysis-v13-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#666;margin-top:6px}
.analysis-v13-legend span{display:inline-flex;align-items:center;gap:5px}

@media(max-width:600px){.analysis-v13-avg-grid{grid-template-columns:1fr}.analysis-v13-chart{height:240px}}
</style>
<script>
/* ANALYSIS V13: meal line charts */
(function(){
  const V={tab:'workout',unit:'day',exercise:'',dir:'正面',pos:0,playing:false,raf:null,last:0};
  const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function monthRange(){return typeof currentMonthRange==='function'?currentMonthRange():(()=>{const n=new Date();return [localDate(new Date(n.getFullYear(),n.getMonth(),1)),localDate(new Date(n.getFullYear(),n.getMonth()+1,0))]})();}
  function mealTotal(a,b){try{return mealRangeTotals(currentUserId,a,b)}catch(e){return {cal:0,p:0,f:0,c:0,meals:0}}}
  function dateAdd(date,n){const d=new Date(date+'T00:00:00');d.setDate(d.getDate()+n);return localDate(d)}
  function daySeries(n){const today=new Date();let end=localDate(today),out=[];for(let i=n-1;i>=0;i--){const d=dateAdd(end,-i),t=mealTotal(d,d);out.push({label:analysisPeriodLabel(d,'day'),cal:+t.cal||0,p:+t.p||0,f:+t.f||0,c:+t.c||0})}return out}
  function weekSeries(n){const today=new Date();const end=localDate(today);const base=new Date(end+'T00:00:00');let dow=base.getDay();let weekEnd=dateAdd(end,6-dow);let out=[];for(let i=n-1;i>=0;i--){let e=dateAdd(weekEnd,-7*i),s=dateAdd(e,-6),t=mealTotal(s,e);out.push({label:`${s.slice(5).replace('-','/')}〜${e.slice(5).replace('-','/')}`,cal:(+t.cal||0)/7,p:(+t.p||0)/7,f:(+t.f||0)/7,c:(+t.c||0)/7})}return out}
  function monthSeries(n){const now=new Date(),out=[];for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),a=localDate(d),b=localDate(new Date(d.getFullYear(),d.getMonth()+1,0)),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),t=mealTotal(a,b);out.push({label:`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`,cal:(+t.cal||0)/days,p:(+t.p||0)/days,f:(+t.f||0)/days,c:(+t.c||0)/days})}return out}
  function drawLine(id,rows,series,ySuffix){const c=document.getElementById(id);if(!c)return;const r=c.getBoundingClientRect(),w=Math.max(300,r.width),h=c.clientHeight||260,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);const vals=[];rows.forEach(q=>series.forEach(s=>vals.push(+q[s.key]||0)));const mx=Math.max(1,...vals),L=48,R=12,T=18,B=42,pw=w-L-R,ph=h-T-B;ctx.font='11px sans-serif';ctx.textAlign='right';ctx.fillStyle='#666';ctx.strokeStyle='#ddd';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=T+ph*i/4;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-R,y);ctx.stroke();ctx.fillText((mx*(1-i/4)).toFixed(mx<10?1:0)+ySuffix,L-5,y+4)}
    const x=i=>L+(rows.length===1?pw/2:pw*i/(rows.length-1));
    series.forEach((s,si)=>{ctx.strokeStyle=si===0?'#222':si===1?'#555':'#888';ctx.lineWidth=2;ctx.beginPath();let started=false;rows.forEach((q,i)=>{const v=+q[s.key]||0;if(v<=0){started=false;return}const xx=x(i),yy=T+ph*(1-v/mx);if(!started){ctx.moveTo(xx,yy);started=true}else ctx.lineTo(xx,yy)});ctx.stroke();ctx.fillStyle=si===0?'#222':si===1?'#555':'#888';rows.forEach((q,i)=>{const v=+q[s.key]||0;if(v<=0)return;const xx=x(i),yy=T+ph*(1-v/mx);ctx.beginPath();ctx.arc(xx,yy,2.5,0,Math.PI*2);ctx.fill()})});
    ctx.fillStyle='#666';ctx.textAlign='center';const step=rows.length<=12?1:Math.ceil(rows.length/7);rows.forEach((q,i)=>{if(i%step===0||i===rows.length-1)ctx.fillText(q.label,x(i),h-14)});
  }
  function chartBlock(title,id,rows,series,desc,suffix){return `<div class="analysis-v10-card"><h3>${title}</h3><div class="analysis-v13-chart-wrap"><canvas id="${id}" class="analysis-v13-chart"></canvas></div><div class="analysis-v13-legend">${series.map((s,i)=>`<span><i class="analysis-v13-dot" style="opacity:${i===0?1:i===1?.7:.45}"></i>${esc(s.label)}</span>`).join('')}</div><div class="note">${desc}</div></div>`}
  function mealView(){
    const [a,b]=monthRange(),t=mealTotal(a,b),wt=parseFloat(profile?.weight)||0,ratio=wt?t.p/wt:null;
    let h=`<div class="analysis-v10-kpis"><div class="analysis-v10-kpi"><span>今月カロリー</span><b>${Math.round(t.cal).toLocaleString()} kcal</b></div><div class="analysis-v10-kpi"><span>今月たんぱく質</span><b>${(+t.p||0).toFixed(1)} g</b></div><div class="analysis-v10-kpi"><span>体重比P</span><b>${ratio==null?'—':ratio.toFixed(2)+'倍'}</b></div><div class="analysis-v10-kpi"><span>食事記録</span><b>${t.meals||0}件</b></div></div>`;
    h+=`<div class="analysis-v10-card"><h3>今月の栄養状況</h3><table class="analysis-v10-table"><tr><th>項目</th><th>合計</th></tr><tr><td>カロリー</td><td>${Math.round(t.cal||0)} kcal</td></tr><tr><td>たんぱく質</td><td>${(+t.p||0).toFixed(1)} g</td></tr><tr><td>脂質</td><td>${(+t.f||0).toFixed(1)} g</td></tr><tr><td>炭水化物</td><td>${(+t.c||0).toFixed(1)} g</td></tr></table><div class="note">体重 ${wt||'未登録'} kg ／ たんぱく質は体重の ${ratio==null?'—':ratio.toFixed(2)+'倍'}</div></div>`;
    h+=chartBlock('日別カロリー','mealCalChart',daySeries(30),[{key:'cal',label:'カロリー'}],'直近30日。記録がない日は0として表示します。',' kcal');
    h+=chartBlock('PFC推移','mealPfcChart',daySeries(30),[{key:'p',label:'P'},{key:'f',label:'F'},{key:'c',label:'C'}],'直近30日のたんぱく質・脂質・炭水化物。',' g');
    h+=`<div class="analysis-v13-avg-grid">`;
    h+=chartBlock('週平均','mealWeekChart',weekSeries(12),[{key:'cal',label:'平均カロリー'}],'直近12週間の1日平均。',' kcal');
    h+=chartBlock('月平均','mealMonthChart',monthSeries(12),[{key:'cal',label:'平均カロリー'}],'直近12か月の1日平均。',' kcal');
    h+=`</div>`;
    return h;
  }
  function workoutView(){
    const os=typeof getExerciseOptions==='function'?getExerciseOptions():[];
    if(!V.exercise||!os.some(x=>x.key===V.exercise))V.exercise=os[0]?.key||'';
    const [a,b]=monthRange();let days=0,sets=0,vol=0;
    Object.keys(data||{}).forEach(d=>{if(d<a||d>b)return;let has=false;(data[d].workouts||[]).forEach(w=>{if((w.userId||currentUserId)!==currentUserId)return;let valid=false;(w.sets||[]).forEach(x=>{let wt=+x.weight||0,r=+x.reps||0;if(wt||r){valid=true;sets++;vol+=wt*r}});if(valid)has=true});if(has)days++});
    const opts=os.map(x=>`<option value="${esc(x.key)}" ${x.key===V.exercise?'selected':''}>${esc(x.cat)}：${esc(x.exercise)}</option>`).join('');
    return `<div class="analysis-v10-kpis"><div class="analysis-v10-kpi"><span>今月トレーニング回数</span><b>${days}回</b></div><div class="analysis-v10-kpi"><span>今月セット数</span><b>${sets}</b></div><div class="analysis-v10-kpi"><span>今月総負荷量</span><b>${Math.round(vol).toLocaleString()} kg</b></div></div>
    <div class="analysis-v10-card analysis-weight-card"><h3>種目別重量推移</h3>
      <div class="row"><div style="flex:1"><label>種目</label><select id="v13ex">${opts}</select></div>
      <div style="flex:1"><label>表示単位</label><select id="v13unit"><option value="day" ${V.unit==='day'?'selected':''}>日別</option><option value="month" ${V.unit==='month'?'selected':''}>月別</option><option value="year" ${V.unit==='year'?'selected':''}>年別</option></select></div></div>
      <div class="analysis-period-caption">${V.unit==='day'?'2026年9月・日別':V.unit==='month'?'月別（年を上部に表示）':'年別'}</div>
      <canvas id="v13workChart" style="width:100%;height:310px;display:block"></canvas>
      <div class="note">日別は1〜31日固定。記録がない日を挟んでも、前後の記録点を線で接続します。月別は1月〜12月、年別は年単位で表示します。</div>
    </div>`;
  }
  function drawWork(){
    const c=document.getElementById('v13workChart'),os=getExerciseOptions?.()||[];
    if(!c||!V.exercise)return;const ex=os.find(x=>x.key===V.exercise);if(!ex)return;
    const now=new Date(),year=now.getFullYear(),month=now.getMonth();
    let ps;
    if(V.unit==='day') ps=Array.from({length:31},(_,i)=>i<new Date(year,month+1,0).getDate()?localDate(new Date(year,month,i+1)):null);
    else if(V.unit==='month') ps=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);
    else ps=periodList('year',5);
    const vals=ps.map(p=>{if(!p)return null;const rr=V.unit==='day'?[p,p]:periodRange(p,V.unit);return maxWeight(currentUserId,ex.cat,ex.exercise,rr[0],rr[1])});
    const r=c.getBoundingClientRect(),w=Math.max(300,r.width),h=310,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;
    const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
    const nums=vals.filter(v=>v!=null),mx=Math.max(1,...nums),L=50,R=14,T=34,B=44,pw=w-L-R,ph=h-T-B;
    x.font='11px sans-serif';x.textAlign='right';x.fillStyle='#666';x.strokeStyle='#ddd';x.lineWidth=1;
    for(let i=0;i<=4;i++){let y=T+ph*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillText(Math.round(mx*(1-i/4))+' kg',L-6,y+4)}
    const px=i=>L+(ps.length===1?pw/2:pw*i/(ps.length-1));
    // nullを飛ばして、存在する記録点同士を一本の折れ線でつなぐ
    x.strokeStyle='#222';x.lineWidth=2.5;x.beginPath();let started=false;
    vals.forEach((v,i)=>{if(v==null)return;const xx=px(i),yy=T+ph*(1-v/mx);if(!started){x.moveTo(xx,yy);started=true}else x.lineTo(xx,yy)});x.stroke();
    x.fillStyle='#222';vals.forEach((v,i)=>{if(v==null)return;const xx=px(i),yy=T+ph*(1-v/mx);x.beginPath();x.arc(xx,yy,3.5,0,Math.PI*2);x.fill()});
    x.fillStyle='#666';x.textAlign='center';x.font='11px sans-serif';
    if(V.unit==='day'){
      [0,4,9,14,19,24,29,30].forEach(i=>{if(i<ps.length&&ps[i])x.fillText(String(i+1),px(i),h-15)});
      x.font='bold 14px sans-serif';x.fillText(`${year}年${month+1}月`,w/2,17);
    }else if(V.unit==='month'){
      ps.forEach((p,i)=>x.fillText(`${i+1}月`,px(i),h-15));
      x.font='bold 14px sans-serif';x.fillText(`${year}年`,w/2,17);
    }else{
      ps.forEach((p,i)=>{if(p)x.fillText(p.slice(0,4)+'年',px(i),h-15)});
    }
  }
  function bodyView(){const ps=typeof photoRecords==='function'?photoRecords(currentUserId):[],dirs=['正面','背面','左側面','右側面'];let h='<div class="analysis-v10-photo-grid">';dirs.forEach(o=>{const a=ps.filter(p=>p.orientation===o);h+=`<div class="analysis-v10-photo-stat"><span>${o}</span><b>${a.length}枚</b><div class="note">最も古い日付：${a.length?a[0].date:'—'}</div></div>`});h+='</div>';h+=`<div class="analysis-v10-card"><h3>身体写真モーフィング</h3><div class="row"><div style="flex:1"><label>方向</label><select id="v13dir">${dirs.map(o=>`<option ${V.dir===o?'selected':''}>${o}</option>`).join('')}</select></div><button id="v13play" type="button">${V.playing?'⏸️ 停止':'▶️ 再生'}</button></div><canvas id="v13morph" style="width:100%;height:300px;display:block;background:#eee;border-radius:10px;margin-top:10px"></canvas><input id="v13seek" type="range" min="0" max="1000" value="${V.pos||0}" style="width:100%"><div class="note" id="v13label"></div><label>速度 <select id="v13speed"><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1" selected>1</option><option value="2">2</option></select>倍</label></div>`;return h}
  function drawMorph(){const c=document.getElementById('v13morph'),lab=document.getElementById('v13label');if(!c)return;const ps=(photoRecords?.(currentUserId)||[]).filter(p=>p.orientation===V.dir&&p.url),r=c.getBoundingClientRect(),w=Math.max(300,r.width),h=300,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);if(!ps.length){ctx.fillStyle='#777';ctx.textAlign='center';ctx.font='15px sans-serif';ctx.fillText('この方向の写真がありません',w/2,h/2);if(lab)lab.textContent='写真なし';return}const draw=(u,a)=>{const im=new Image();im.onload=()=>{ctx.save();ctx.globalAlpha=a;const z=Math.min(w/im.width,h/im.height),dw=im.width*z,dh=im.height*z;ctx.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);ctx.restore()};im.src=u};if(ps.length===1){draw(ps[0].url,1);lab.textContent=ps[0].date;return}const t=(V.pos||0)/1000*(ps.length-1),i=Math.min(ps.length-2,Math.floor(t)),a=t-i;draw(ps[i].url,1-a);draw(ps[i+1].url,a);lab.textContent=`${ps[i].date} → ${ps[i+1].date} ${Math.round(a*100)}%`}
  function stop(){V.playing=false;if(V.raf)cancelAnimationFrame(V.raf);V.raf=null;V.last=0;const b=document.getElementById('v13play');if(b)b.textContent='▶️ 再生'}
  function tick(ts){if(!V.playing)return;const sp=parseFloat(document.getElementById('v13speed')?.value||1);if(!V.last)V.last=ts;V.pos=(V.pos||0)+(ts-V.last)*0.06*sp;V.last=ts;if(V.pos>1000)V.pos=0;const q=document.getElementById('v13seek');if(q)q.value=V.pos;drawMorph();V.raf=requestAnimationFrame(tick)}
  function renderV13(){const el=document.getElementById('analysis');if(!el)return;stop();let h=`<div class="card"><h2>分析</h2><div class="analysis-v10-tabs"><button type="button" class="analysis-v10-tab ${V.tab==='workout'?'active':''}" data-v13="workout">🏋️ 筋トレ</button><button type="button" class="analysis-v10-tab ${V.tab==='meal'?'active':''}" data-v13="meal">🍚 食事</button><button type="button" class="analysis-v10-tab ${V.tab==='body'?'active':''}" data-v13="body">📸 身体</button></div>${V.tab==='workout'?workoutView():V.tab==='meal'?mealView():bodyView()}</div>`;el.innerHTML=h;el.querySelectorAll('[data-v13]').forEach(b=>b.onclick=()=>{V.tab=b.dataset.v13;renderV13()});if(V.tab==='workout'){el.querySelector('#v13ex')?.addEventListener('change',e=>{V.exercise=e.target.value;drawWork()});el.querySelector('#v13unit')?.addEventListener('change',e=>{V.unit=e.target.value;drawWork()});drawWork()}else if(V.tab==='meal'){requestAnimationFrame(()=>{drawLine('mealCalChart',daySeries(30),[{key:'cal',label:'カロリー'}],' kcal');drawLine('mealPfcChart',daySeries(30),[{key:'p',label:'P'},{key:'f',label:'F'},{key:'c',label:'C'}],' g');drawLine('mealWeekChart',weekSeries(12),[{key:'cal',label:'平均カロリー'}],' kcal');drawLine('mealMonthChart',monthSeries(12),[{key:'cal',label:'平均カロリー'}],' kcal')})}else{el.querySelector('#v13dir')?.addEventListener('change',e=>{V.dir=e.target.value;V.pos=0;drawMorph()});el.querySelector('#v13seek')?.addEventListener('input',e=>{V.pos=+e.target.value;drawMorph()});el.querySelector('#v13play')?.addEventListener('click',()=>{if(V.playing)stop();else{V.playing=true;document.getElementById('v13play').textContent='⏸️ 停止';V.last=0;V.raf=requestAnimationFrame(tick)}});drawMorph()}}
  window.renderAnalysis=renderV13;
  window.addEventListener('resize',()=>{if(state?.tab==='analysis'){if(V.tab==='workout')drawWork();else if(V.tab==='meal')drawMealCharts();else drawMorph()}});
  document.addEventListener('click',e=>{if(e.target.closest?.('.nav[data-tab="analysis"]'))setTimeout(renderV13,40)});
})();
</script>
